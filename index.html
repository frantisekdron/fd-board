<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FD BOARD — řídicí stanice</title>
<style>
@font-face{font-family:'B612';src:url('fonts/B612-Regular.ttf');font-weight:400;font-display:swap}
@font-face{font-family:'B612';src:url('fonts/B612-Bold.ttf');font-weight:700;font-display:swap}
@font-face{font-family:'B612 Mono';src:url('fonts/B612Mono-Regular.ttf');font-weight:400;font-display:swap}
@font-face{font-family:'B612 Mono';src:url('fonts/B612Mono-Bold.ttf');font-weight:700;font-display:swap}
:root{
  --bg:#0a0e12; --bg2:#0d1319; --panel:#111820; --panel2:#0f151c; --grid:#1b2530;
  --edge:#223040; --ink:#d6e0e8; --dim:#6b7a88; --dim2:#465562;
  --sk:#35e0d0; --me:#b28bff; --da:#f5b73d; --se:#5b8dff; --pr:#46d17f; --brand:#ff5a5f;
  --re:#ff8a5b; --pg:#ff6ad5;
  --hov:#ffffff08; --hov2:#ffffff0d; --on-accent:#0a0e12; --bg-glow:#12202a; --bg-deep:#080b0f;
  --warn-ink:#f5d79a; --cv-node:#0d141b; --cv-dot:rgba(255,255,255,0.05);
  --cv-tip:rgba(10,14,18,0.92); --cv-label:#e8f0f6;
  --mono:"B612 Mono","SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"B612",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
/* DEN režim — denní kokpit: teplá papírová šedá, ztmavené akcenty (neon na bílé nečte) */
html[data-t=light]{
  --bg:#e9e6de; --bg2:#e0ddd3; --panel:#f4f2ea; --panel2:#ebe8df; --grid:#d8d4c8;
  --edge:#c6c1b2; --ink:#20261f; --dim:#5c6157; --dim2:#8b9083;
  --sk:#0f7d72; --me:#6d3fc4; --da:#a8650a; --se:#2454c9; --pr:#1e7c46;
  --brand:#d03a3f; --re:#bb4c17; --pg:#b52377;
  --hov:#00000006; --hov2:#0000000d; --on-accent:#f4f2ea; --bg-glow:#dfe6e2; --bg-deep:#d8d4c8;
  --warn-ink:#7a5a10; --cv-node:#f4f2ea; --cv-dot:rgba(0,0,0,0.07);
  --cv-tip:rgba(244,242,234,0.95); --cv-label:#20261f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
table{border-collapse:collapse;width:100%}

/* ===== v7 skelet ===== */
.v7-app{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.v7-top{position:relative;height:46px;flex:0 0 46px;display:flex;align-items:center;gap:18px;
  padding:0 16px;border-bottom:1px solid var(--edge);background:var(--panel)}
.v7-brand{font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:.5px;white-space:nowrap}
.v7-brand b{color:var(--brand)}
.v7-tabs{display:flex;gap:2px;overflow-x:auto;flex:1;height:100%}
.v7-tabs button{all:unset;cursor:pointer;display:flex;align-items:center;padding:0 12px;height:100%;
  font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;
  border-bottom:2px solid transparent}
.v7-tabs button:hover{color:var(--ink)}
.v7-tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.v7-n{display:inline-block;margin-left:5px;min-width:14px;padding:0 4px;border-radius:8px;background:var(--brand);
  color:#fff;font-size:9px;line-height:15px;text-align:center;font-weight:700}
.v7-ico{all:unset;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--dim);font-size:15px}
.v7-ico:hover{background:var(--hov);color:var(--ink)}
.v7-main{flex:1;overflow:auto;padding:12px 18px 60px}
.v7-foot{flex:0 0 auto;height:28px;display:flex;align-items:center;gap:0;padding:0 16px;
  border-top:1px solid var(--edge);background:var(--panel);color:var(--dim);font-size:11px;
  overflow-x:auto;white-space:nowrap}
.v7-foot a{color:var(--dim);text-decoration:none;cursor:pointer}
.v7-foot a:hover{color:var(--ink);text-decoration:underline}

/* ===== hlavička sekce ===== */
.v7-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.v7-h b{font-family:var(--sans);font-size:15px;font-weight:800}
.v7-h3{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--dim);margin:18px 0 8px}
.v7-sub{color:var(--dim);font-size:11.5px}
.v7-stamp{font-size:11px;color:var(--dim);margin-left:auto}
.v7-stamp.bad{color:var(--brand)}

/* ===== varování ===== */
.v7-warn{background:color-mix(in srgb, var(--brand) 12%, transparent);border-left:3px solid var(--brand);
  color:var(--warn-ink);padding:7px 12px;font-size:11.5px;margin:0 0 10px;border-radius:2px}
.v7-warn.soft{background:var(--hov2);border-left-color:var(--dim2);color:var(--dim)}

/* ===== tabulka ===== */
.v7-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);
  padding:6px 8px;border-bottom:1px solid var(--edge)}
.v7-table td{padding:8px;font-size:12px;border-bottom:1px solid var(--grid);vertical-align:top}
.v7-table tbody tr{cursor:pointer}
.v7-table tbody tr:hover{background:var(--hov)}
.v7-table tr.v7-inline{cursor:default}
.v7-table tr.v7-inline:hover{background:transparent}
.v7-table tr.v7-inline td{padding:8px}

/* ===== tlačítka ===== */
.v7-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  padding:3px 8px;border-radius:5px;font-size:12px;line-height:1.4}
.v7-btn.run{background:var(--pr);color:var(--on-accent);font-weight:700}
.v7-btn.run:hover{filter:brightness(1.08)}
.v7-btn.run.off{background:transparent;border:1px solid var(--edge);color:var(--dim2);cursor:not-allowed}
.v7-btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--dim)}
.v7-btn.ghost:hover{color:var(--ink);border-color:var(--dim2)}

/* ===== čekání ===== */
.v7-wait{color:var(--dim)}
.v7-wait.w5{color:var(--da)}
.v7-wait.w10{color:var(--brand);font-weight:700}

/* ===== V4: nápady + lab ===== */
.v7-keys{color:var(--dim);font-size:10.5px;margin-left:auto;white-space:nowrap}
.v7-napad{font-size:16px;line-height:1.5;padding:18px;border:1px solid var(--edge);border-radius:8px;
  background:var(--panel);margin-bottom:10px}
.v7-napad-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.v7-btn.yes{background:var(--pr);color:var(--on-accent);font-weight:700}
.v7-btn.yes:hover{filter:brightness(1.08)}
.v7-btn.no{background:var(--brand);color:#fff;font-weight:700}
.v7-btn.no:hover{filter:brightness(1.08)}
.v7-btn.later{background:var(--da);color:var(--on-accent);font-weight:700}
.v7-btn.later:hover{filter:brightness(1.08)}
.v7-chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px;margin-left:auto;cursor:pointer}
.v7-list{margin:14px 0;border:1px solid var(--edge);border-radius:8px;padding:2px 12px;background:var(--panel2)}
.v7-list summary{cursor:pointer;padding:10px 0;font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:var(--dim);font-weight:700;list-style:none}
.v7-list summary::-webkit-details-marker{display:none}
.v7-list summary::before{content:'▸ ';display:inline-block}
.v7-list[open] summary::before{content:'▾ '}
.v7-idearow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--grid);font-size:12px}
.v7-idearow:last-child{border-bottom:none}
.v7-idearow .t{flex:1;min-width:0}
.v7-idearow .src{color:var(--dim);font-size:10.5px;white-space:nowrap}
.v7-idearow .btns{display:flex;gap:4px;flex-shrink:0}
.v7-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ===== prázdné stavy ===== */
.v7-empty{color:var(--dim);padding:28px;text-align:center;border:1px dashed var(--edge);border-radius:8px;font-size:12.5px}
.v7-empty.bad{color:var(--brand);border-color:var(--brand)}

/* ===== drobnosti ===== */
.v7-mono{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--edge);
  border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;margin:10px 0}
.v7-sel{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:5px;padding:3px 6px;font-size:12px}
.v7-inp{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:5px;padding:5px 8px;
  font-size:12px;width:min(360px,60%)}
.v7-drow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--grid);
  font-size:12px}
.v7-drow span:first-child{color:var(--dim)}
.v7-drow.v7-click{cursor:pointer}
.v7-drow.v7-click:hover{background:var(--hov)}
.v7-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ===== V5: mapa ===== */
.v7-mapa-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.v7-chip{all:unset;cursor:pointer;padding:3px 10px;border-radius:12px;font-size:11px;border:1px solid var(--edge);color:var(--ink)}
.v7-chip.off{color:var(--dim2);opacity:.55}
.v7-chip:hover{border-color:var(--dim2)}
#mapaQ{background:var(--panel2);border:1px solid var(--edge);border-radius:5px;padding:5px 8px;color:var(--ink);font-size:12px;width:150px}
.v7-mapa-bar label{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px;margin-left:auto;white-space:nowrap}
.v7-mapa-wrap{position:relative;height:min(70vh,720px);border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--panel2)}
.v7-mapa-wrap canvas{display:block;width:100%;height:100%}
.v7-mapa-side{position:absolute;right:0;top:0;width:min(340px,42%);height:100%;overflow:auto;
  background:var(--panel);border-left:1px solid var(--edge);padding:14px}
.v7-mapa-paths{margin-top:14px}
.v7-path{padding:8px 0;border-bottom:1px solid var(--grid);font-size:12px;cursor:pointer}
.v7-path b{cursor:pointer}
.v7-path b:hover{text-decoration:underline}
.v7-step{display:inline-block;margin:2px 3px 2px 0;padding:2px 8px;border-radius:10px;font-size:10.5px;
  border:1px solid var(--edge);color:var(--dim)}
.v7-step.ok{border-color:var(--pr);color:var(--pr)}
.v7-step.bad{border-color:var(--brand);color:var(--brand)}
.v7-step.unk{border-color:var(--dim2)}

/* ===== drawer + scrim ===== */
.v7-scrim{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.2s;z-index:19}
.v7-scrim.on{opacity:1;pointer-events:auto}
.v7-drawer{position:absolute;top:0;right:0;height:100%;width:min(520px,94vw);transform:translateX(100%);
  transition:.2s;background:var(--bg2);border-left:1px solid var(--edge);overflow:auto;z-index:20}
.v7-drawer.on{transform:none}
.v7-dhead{position:relative;padding:16px 40px 14px 18px;border-bottom:2px solid var(--dc,var(--edge))}
.v7-dhead .v7-dclose{position:absolute;top:12px;right:12px}
.v7-dclose{all:unset;cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--dim)}
.v7-dclose:hover{background:var(--hov);color:var(--ink)}
.v7-dkicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dc,var(--dim))}
.v7-dhead h2{font-family:var(--sans);font-size:17px;font-weight:800;margin-top:4px}
.v7-dbody{padding:16px 18px 30px}
.v7-dbody p{font-size:12.5px;line-height:1.6;margin-bottom:10px}

/* ===== příkazová paleta ===== */
.v7-cmd{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(560px,92vw);
  background:var(--panel);border:1px solid var(--edge);border-radius:10px;box-shadow:0 20px 60px #000a;
  z-index:30;display:none;overflow:hidden}
.v7-cmd.on{display:block}
.v7-cmd input{width:100%;background:var(--panel2);border:none;border-bottom:1px solid var(--edge);
  padding:12px 14px;outline:none;font-size:13px}
#v7CmdRes{max-height:50vh;overflow:auto;padding:6px 0}
.v7-cmdgrp{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:8px 14px 2px}
.v7-cmdrow{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;cursor:pointer;font-size:12.5px}
.v7-cmdrow.sel,.v7-cmdrow:hover{background:var(--hov)}
.v7-cmdrow .v7-ds{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:700px){
  .v7-tabs{-webkit-overflow-scrolling:touch}
  .v7-table thead{display:none}
  .v7-table,.v7-table tbody,.v7-table tr,.v7-table td{display:block;width:100%}
  .v7-table tr{border-bottom:1px solid var(--grid);padding:6px 0}
  .v7-table tr.v7-inline{padding:8px 0}
  .v7-table td{border-bottom:none;padding:3px 0;display:flex;flex-direction:column;gap:2px}
  .v7-table td[data-l]::before{content:attr(data-l);color:var(--dim);font-size:9px;letter-spacing:1px;text-transform:uppercase}
  .v7-table td[data-l="ZA KOLIK"]:empty{display:none}
  .v7-table td[data-l="▶"],.v7-table td[data-l="📋"]{display:inline-flex;width:auto;padding-right:10px}
  .v7-table td[data-l="▶"]::before,.v7-table td[data-l="📋"]::before{content:none}
  .v7-drawer{width:100vw}
  .v7-mapa-side{position:static;width:100%;height:auto;border-left:none;border-top:1px solid var(--edge)}
  .v7-mapa-wrap{height:60vh}

<body>
<div id="pwgate" style="display:none;position:fixed;inset:0;z-index:99;background:radial-gradient(120% 90% at 50% 10%,#12202a 0,#0a0e12 70%);align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:34px 36px;max-width:360px;text-align:center">
    <div style="font-family:var(--sans);font-weight:800;font-size:22px">FD <span style="color:var(--brand)">BOARD</span></div>
    <div style="color:var(--dim);font-size:11px;letter-spacing:2px;margin:6px 0 18px;text-transform:uppercase">Pozemní řídicí stanice</div>
    <input id="pwin" type="password" placeholder="Heslo" autocomplete="off" style="width:100%;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:11px 14px;color:var(--ink);font-family:var(--mono);font-size:14px;outline:none;text-align:center">
    <button id="pwbtn" type="button" style="all:unset;cursor:pointer;margin-top:12px;width:100%;box-sizing:border-box;text-align:center;background:var(--brand);color:#fff;font-weight:700;font-family:var(--mono);padding:11px;border-radius:8px">Vstoupit →</button>
    <div id="pwerr" style="color:var(--brand);font-size:11px;margin-top:10px;min-height:14px"></div>
  </div>
</div>
<div class="v7-app">
  <header class="v7-top">
    <div class="v7-brand">FD <b>BOARD</b></div>
    <nav class="v7-tabs" id="v7Tabs">
      <button data-t="leady" class="on">Leady</button>
      <button data-t="zakazky">Zakázky</button>
      <button data-t="napady">Nápady <span class="v7-n" id="nNapady"></span></button>
      <button data-t="lab">Lab <span class="v7-n" id="nLab"></span></button>
    </nav>
    <button class="v7-ico" id="v7Search" title="hledat (⌘K)">⌕</button>
  </header>
  <main class="v7-main" id="v7View"></main>
  <footer class="v7-foot" id="v7Foot"></footer>
  <div class="v7-scrim" id="v7Scrim"></div>
  <aside class="v7-drawer" id="v7Drawer"><div id="v7DrawerC"></div></aside>
  <div class="v7-cmd" id="v7Cmd"><input id="v7CmdIn" placeholder="hledej: leady, zakázky, nápady, milníky, skilly, paměť…"><div id="v7CmdRes"></div></div>
</div>
<script>
//////////////////// stav ////////////////////
const SECTORS={leady:1,zakazky:1,napady:1,lab:1};
let DB=null, ONLINE=false, API='', cur='leady', JOBS=[], SNAP='', jobPoll=0, drawerKind=null, FIN=null;
let bootRetry=0, zakInlineFor=null, cmdSel=0, cmdItems=[], cmdMode='search';
let labView='tabulka';
let mapaHidden=new Set(), mapaOnlyLinked=true, mapaQ='', mapaPinned=new Set(), mapaSel=null, mapaOld=false;
let mapaState=null, mapaView={x:0,y:0,k:1,inited:false}, mapaRAF=0, mapaHoverNode=null, mapaHoverEdgeIdx=-1;
let mapaPathBuilding=null, mapaPathHighlight=null;
let mapaDragMode=null, mapaPanStart=null, mapaLinkFrom=null, mapaLinkCur=null, mapaMouseDownId=null;
const SEED={akce:{rows:[],meta:{}},pipeline:[],lab:{},mapa:{nodes:[],edges:[],paths:[]},jobs:[],brief:{},overview:{},skills:[],memory:[],data:[],registry:{},settings:{},artifacts:[],degraded:[]};

//////////////////// util (kopie z FD_BOARD_full.html) ////////////////////
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function copy(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('Zkopírováno do schránky')).catch(()=>toast('Zkopíruj ručně'));}else toast('Schránka nedostupná');}
let toastT;function toast(m){let el=$('#toastEl');if(!el){el=document.createElement('div');el.id='toastEl';el.style.cssText='position:fixed;bottom:18px;right:18px;background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--sk);color:var(--ink);padding:9px 14px;border-radius:4px;font-size:11.5px;z-index:50;transition:.3s;box-shadow:0 10px 30px #000a;font-family:var(--mono)';document.body.appendChild(el);}el.textContent='▸ '+new Date().toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'  '+m;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2600);}
function fmtKc(n){const v=Number(n);return Number.isFinite(v)?Math.round(v).toLocaleString('cs-CZ')+' Kč':esc(String(n));}
function fmtAgeH(h){return h<48?h+' h':Math.round(h/24)+' d';}
function baseName(p){return (p||'').replace(/\/+$/,'').split('/').pop();}
function dirName(p){const parts=(p||'').replace(/\/+$/,'').split('/');parts.pop();return parts.join('/');}
function degNames(list){return [...new Set((list||[]).map(d=>typeof d==='string'?d:(d.name||d.file||'?')))];}

//////////////////// spojení / offline / snapshot (kopie 1047-1098) ////////////////////
async function connect(){
  const bases=location.protocol.startsWith('http')?['','http://127.0.0.1:8777']:['http://127.0.0.1:8777','http://localhost:8777'];
  for(const b of bases){try{const r=await fetch(b+'/api/all',{cache:'no-store'});if(r.ok){API=b;return await r.json();}}catch(e){}}
  return null;
}
async function unlock(pw){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),E=window.FD_ENC;
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.salt),iterations:200000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.iv)},key,b(E.data));
  window.FD_BAKED=JSON.parse(new TextDecoder().decode(pt));
}
function gateEnc(){return new Promise(res=>{
  const g=$('#pwgate');
  const saved=sessionStorage.getItem('fdb_key');
  const attempt=async pw=>{try{await unlock(pw);sessionStorage.setItem('fdb_key',pw);g.style.display='none';res();return true;}
    catch(e){sessionStorage.removeItem('fdb_key');return false;}};
  (async()=>{
    if(saved&&await attempt(saved))return;
    g.style.display='flex';
    const tryit=async()=>{if(!(await attempt($('#pwin').value))){$('#pwerr').textContent='Špatné heslo.';$('#pwin').value='';}};
    $('#pwbtn').onclick=tryit;$('#pwin').onkeydown=e=>{if(e.key==='Enter')tryit();};
    setTimeout(()=>$('#pwin').focus(),50);
  })();
});}
async function verCheck(){
  if(location.protocol==='file:')return;
  if(!window.FD_BUILD||!window.FD_ENC)return;
  try{const r=await fetch('version.json?ts='+Date.now(),{cache:'no-store'});
    const v=(await r.json()).build;
    if(v&&v!==window.FD_BUILD){toast('Nová verze — načítám…');setTimeout(()=>location.replace(location.pathname+'?v='+v),900);}
  }catch(e){}
}
function startRetry(){
  if(bootRetry)return;
  bootRetry=setInterval(async()=>{
    const d=await connect();
    if(d){clearInterval(bootRetry);bootRetry=0;DB=d;ONLINE=true;
      finalize(true);toast('✓ Připojeno k serveru — živá data');}
  },4000);
}

//////////////////// boot ////////////////////
async function boot(){ if(window.FD_ENC){await gateEnc();verCheck();setInterval(verCheck,300000);}
  const d=window.FD_BAKED?null:await connect(); if(d){DB=d;ONLINE=true;}
  else if(window.FD_BAKED){DB=FD_BAKED.all;ONLINE=false;SNAP=FD_BAKED.stamp||'';}
  else{DB=SEED;ONLINE=false;startRetry();}
  finalize(true);}
async function finalize(rerender){
  DB.akce=DB.akce||{rows:[],meta:{}}; DB.lab=DB.lab||{}; DB.mapa=DB.mapa||{nodes:[],edges:[],paths:[]}; DB.pipeline=DB.pipeline||[]; DB.degraded=DB.degraded||[];
  if(ONLINE){try{FIN=await (await fetch(API+'/api/data?id=faktury')).json();}catch(e){FIN=null;} JOBS=DB.jobs||[]; refreshJobs();}
  else if(window.FD_BAKED){FIN=(FD_BAKED.details||{}).faktury||null;}
  badges(); paticka(); if(rerender)route();}
function badges(){ const L=DB.lab||{}; $('#nNapady').textContent=((L.ideas||[]).filter(i=>i.stav==='inbox'&&!i.deleted).length)||''; $('#nLab').textContent=((L.milestones||[]).filter(m=>!m.deleted&&['build','test'].includes(m.status)).length)||''; }
function go(t){cur=t;$$('#v7Tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));location.hash=t;route();}
function route(){const v=$('#v7View');v.innerHTML='';({leady,zakazky,napady,lab}[cur]||leady)(v);}
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(SECTORS[t]&&t!==cur)go(t);});

//////////////////// joby ////////////////////
async function runPrompt(prompt,label,kind){
  if(!ONLINE){copy(prompt);return;}
  try{
    const r=await fetch(API+'/api/run',{method:'POST',body:JSON.stringify({prompt,label,kind:kind||'terminal'})});
    const j=await r.json();
    if(r.status===409){toast('Běží už 2 joby — počkej.');return;}
    if(!j.ok){toast('Nespuštěno: '+(j.err||'?'));return;}
    toast(kind==='headless'?'Job spuštěn — sektor Zázemí':'Terminál otevřen s promptem');
    if(kind==='headless')refreshJobs();
  }catch(e){toast('Server neodpověděl');copy(prompt);}
}
async function refreshJobs(){
  if(!ONLINE)return;
  try{JOBS=await (await fetch(API+'/api/jobs',{cache:'no-store'})).json();}catch(e){return;}
  paticka();
  if(drawerKind==='zazemi')zazemiDrawer();
  clearTimeout(jobPoll);
  const run=JOBS.filter(j=>j.state==='running').length;
  if(run>0)jobPoll=setTimeout(refreshJobs,2000);
}

//////////////////// akce / tlačítka ////////////////////
function act(prompt,label){ if(ONLINE) return runPrompt(prompt,label,'headless'); copy(prompt); toast('Server neběží — prompt zkopírován'); }
function btnRun(prompt,label,title){ return ONLINE? `<button class="v7-btn run" data-run="${esc(prompt)}" data-lab="${esc(label)}" title="${esc(title||'spustí Clauda na pozadí')}">▶</button>` : `<button class="v7-btn run off" disabled title="jen s běžícím serverem — použij 📋">▶</button>`; }
function btnCopy(text){ return `<button class="v7-btn ghost" data-p="${esc(text)}" title="zkopíruje hotový text">📋</button>`; }
function bindBtns(sel){
  $$(sel+' [data-run]:not(.off)').forEach(b=>{b.onclick=e=>{e.stopPropagation();act(b.dataset.run,b.dataset.lab);};});
  $$(sel+' [data-p]').forEach(b=>{b.onclick=e=>{e.stopPropagation();copy(b.dataset.p);};});
}

//////////////////// drawer (přepis na v7 id/třídy, kopie logiky 3548-3559) ////////////////////
function drawer(k,title,cvar,html){
  $('#v7DrawerC').innerHTML=`<div class="v7-dhead" style="--dc:var(${cvar})"><button class="v7-dclose" onclick="closeDrawer()">✕</button>
    <div class="v7-dkicker">${esc(k)}</div><h2>${esc(title)}</h2></div><div class="v7-dbody">${html}</div>`;
  $('#v7Drawer').classList.add('on');$('#v7Scrim').classList.add('on');
}
function closeDrawer(){$('#v7Drawer').classList.remove('on');$('#v7Scrim').classList.remove('on');drawerKind=null;}

//////////////////// LEADY ////////////////////
function leady(v){
  const akce=DB.akce||{rows:[],meta:{}};
  const rows=akce.rows||[];
  const meta=akce.meta||{};
  const posta=meta.posta_stara_h;
  const stampCls=(posta==null||posta>12)?'bad':'';
  const degList=degNames([...(meta.degraded||[]),...(DB.degraded||[])]);
  let html=`<div class="v7-h"><b>Komu dnes volat</b> <span class="v7-sub">${rows.length} řádků · řazení: ${esc(meta.razeni||'typ → dny čekání → částka')}</span>
    <span class="v7-stamp ${stampCls}">pošta: poslední zpráva ${posta==null?'—':'před '+fmtAgeH(posta)}</span>
    ${ONLINE?'<button class="v7-btn ghost" id="postaRefresh" title="spustí analýzu schránky honza@ (job)">↻ obnov poštu</button>':''}</div>`;
  if(degList.length){
    html+=`<div class="v7-warn">⚠ Poškozený zdroj: ${esc(degList.join(', '))} — řádky z něj chybí, ticho v tabulce není klid.</div>`;
  }
  if(!meta.kk_ok && ONLINE){
    html+='<div class="v7-warn soft">kokpity makléřů nedostupné — úkoly makléřů chybí</div>';
  }
  if(!rows.length){
    if(!ONLINE && SNAP){
      html+='<div class="v7-empty">Snapshot bez pošty a zakázek — leady jsou jen lokálně.</div>';
    } else {
      html+=`<div class="v7-empty ${stampCls}">Nic nečeká. Pošta naposledy obnovena ${esc(meta.posta_stamp||meta.stamp||'—')}.</div>`;
    }
    v.innerHTML=html;
    const pr=$('#postaRefresh'); if(pr)pr.onclick=()=>act('Obnov poštu: spusť analýzu schránky honza@frantisekdron.cz podle skillu/memory fd-posta-analyza a přepiš ~/Desktop/bordel/claude/fd_board_email.json (leady, leady_aktivni, admin_ukoly, podvody, generated). Nic neodesílej.','obnov poštu');
    return;
  }
  const anyKc=rows.some(r=>r.kc>0);
  html+=`<table class="v7-table"><thead><tr><th>KDO / CO</th><th>ODKUD</th><th>ČEKÁ</th>${anyKc?'<th>ZA KOLIK</th>':''}<th>▶</th><th>📋</th></tr></thead><tbody>
    ${rows.map(r=>`<tr data-id="${esc(r.id)}">
      <td data-l="KDO / CO"><b>${esc(r.kdo||'')}</b><br><span class="v7-sub">${esc(r.co||'')}</span></td>
      <td data-l="ODKUD">${esc(r.odkud||'')}</td>
      <td data-l="ČEKÁ"><span class="v7-wait ${r.dni>10?'w10':r.dni>5?'w5':''}">${r.dni??'—'} d</span></td>
      ${anyKc?`<td data-l="ZA KOLIK">${r.kc?fmtKc(r.kc):''}</td>`:''}
      <td data-l="▶">${btnRun(r.prompt,r.label)}</td>
      <td data-l="📋">${btnCopy(r.kopie)}</td>
    </tr>`).join('')}
  </tbody></table>`;
  v.innerHTML=html;
  bindBtns('#v7View');
  const pr=$('#postaRefresh'); if(pr)pr.onclick=()=>act('Obnov poštu: spusť analýzu schránky honza@frantisekdron.cz podle skillu/memory fd-posta-analyza a přepiš ~/Desktop/bordel/claude/fd_board_email.json (leady, leady_aktivni, admin_ukoly, podvody, generated). Nic neodesílej.','obnov poštu');
  $$('#v7View tbody tr[data-id]').forEach(tr=>{
    tr.onclick=(e)=>{if(e.target.closest('button'))return;const r=rows.find(x=>x.id===tr.dataset.id);if(r)leadDrawer(r);};
  });
}
function leadDrawer(r){
  drawerKind='lead';
  const det=r.detail||{};
  let rowsHtml=`<div class="v7-drow"><span>odkud</span><b>${esc(r.odkud||'—')}</b></div>
    <div class="v7-drow"><span>čeká</span><b>${r.dni??'—'} d</b></div>
    <div class="v7-drow"><span>částka</span><b>${r.kc?fmtKc(r.kc):'—'}</b></div>`;
  if(det.stav||det.historie){
    if(det.stav) rowsHtml+=`<div class="v7-drow"><span>stav</span><b>${esc(det.stav)}</b></div>`;
    if(Array.isArray(det.historie)&&det.historie.length){
      rowsHtml+=`<div class="v7-drow"><span>historie</span><b>${det.historie.slice(-3).map(h=>esc(typeof h==='string'?h:((h.ts?h.ts+' – ':'')+(h.stav||h.pozn||'')))).join('<br>')}</b></div>`;
    }
  }
  const co=det.co||r.co||'';
  const promptShort=(r.prompt||'').slice(0,500);
  const html=`<p>${esc(co)}</p>${rowsHtml}<div class="v7-mono">${esc(promptShort)}</div>
    <div class="v7-actions">
      ${btnRun(r.prompt,r.label)}
      ${btnCopy(r.kopie)}
      <button class="v7-btn ghost" data-act="hotovo">✓ Hotovo</button>
      <button class="v7-btn ghost" data-act="odlozit7">💤 Odložit 7 dní</button>
      <button class="v7-btn ghost" data-act="signal">➕ Signál do Labu</button>
    </div>`;
  drawer((r.typ||'lead').toUpperCase(),r.kdo||'','--brand',html);
  bindBtns('#v7DrawerC');
  const dc=$('#v7DrawerC');
  const bh=dc.querySelector('[data-act="hotovo"]'); if(bh)bh.onclick=()=>akceStav(r.id,'hotovo');
  const bo=dc.querySelector('[data-act="odlozit7"]'); if(bo)bo.onclick=()=>akceStav(r.id,'odlozit7');
  const bs=dc.querySelector('[data-act="signal"]'); if(bs)bs.onclick=()=>promptSignal(r);
}
async function akceStav(id,stav){
  if(!ONLINE){toast('jen s běžícím serverem');return;}
  try{
    const r=await fetch(API+'/api/akce/stav',{method:'POST',body:JSON.stringify({id,stav})});
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok||j.ok===false){toast('Nepovedlo se uložit stav');return;}
    DB.akce=await (await fetch(API+'/api/akce')).json();
    closeDrawer();route();toast('Uloženo');
  }catch(e){toast('Server neodpověděl');}
}
function promptSignal(r){
  const q=prompt('Co klient řekl / co je za tím? (citace)');
  if(!q)return;
  const item={id:'sig-'+Date.now().toString(36),source:r.typ==='poptavka'?'email':'zakazka',source_ref:r.id,klient:r.kdo,quote:q,tema:'',milestone_ids:[],date:new Date().toISOString().slice(0,10),evidence_status:'conversation_synthesis'};
  if(!ONLINE){toast('Server neběží — signál neuložen');return;}
  fetch(API+'/api/lab/upsert',{method:'POST',body:JSON.stringify({entity:'signals',by:'human',item})})
    .then(()=>toast('Signál uložen do Labu')).catch(()=>toast('Uložení selhalo'));
}

//////////////////// ZAKÁZKY ////////////////////
const STAV_LABEL={pripravena:'připravená',odeslana:'odeslaná',ticho:'ticho',jednani:'jednání',vyhrano:'vyhráno',prohrano:'prohráno'};
const PIPE_TEMPLATES={
  pripravena:z=>`Zakázka ${z.cislo||z.id} (${z.nazev||''}) je připravená k odeslání klientovi ${z.klient||''}. Zkontroluj nabídku a naplánuj odeslání.`,
  odeslana:z=>`Zakázka ${z.cislo||z.id} (${z.nazev||''}) byla odeslána klientovi ${z.klient||''}. Připrav follow-up zprávu.`,
  ticho:z=>`Na zakázku ${z.cislo||z.id} (${z.nazev||''}) je ticho ${z.silentDays||''} dní. Připrav připomínku klientovi ${z.klient||''}.`,
  jednani:z=>`Zakázka ${z.cislo||z.id} (${z.nazev||''}) je v jednání s ${z.klient||''}. Připrav další krok / odpověď na poslední zprávu.`,
  vyhrano:z=>`Zakázku ${z.cislo||z.id} (${z.nazev||''}) jsme vyhráli. Připrav produkční checklist: termíny, podklady od klienta, harmonogram natáčení a co poslat jako potvrzení.`,
  prohrano:z=>`Zakázku ${z.cislo||z.id} (${z.nazev||''}) jsme prohráli. Zjisti důvod, zapiš poznatek do memory a navrhni, co příště v nabídce změnit.`
};
function tpl(z){return (PIPE_TEMPLATES[z.stavN]||PIPE_TEMPLATES.ticho)(z);}
function finLine(){
  if(!FIN) return '<div class="v7-sub">Faktury: dataset nedostupný</div>';
  const chart=Array.isArray(FIN.chart)?FIN.chart:[];
  const last12=chart.slice(-12);
  const sum=last12.reduce((s,c)=>s+(typeof c==='number'?c:(Array.isArray(c)?(c[1]||0):(c.value||c.kc||c.hodnota||0))),0);
  const finMeta=(DB.data||[]).find(d=>d.id==='faktury'||(d.file||'').includes('faktury'));
  const stamp=FIN.stamp||(finMeta?finMeta.age:'');
  return `<div class="v7-sub">Faktury (dataset ${esc(stamp||'—')}): za 12 měsíců ${Math.round(sum).toLocaleString('cs-CZ')} tis. Kč · průměr ${FIN.avgMonth??'—'} tis./měs.</div>`;
}
function baseNameZak(z){return baseName(dirName(z.path||''));}
function btnOpenZak(z){
  const folder=baseNameZak(z);
  const p=`Otevři ~/Desktop/bordel/claude/nabidky/${folder}/zakazka.json a shrň stav a další krok.`;
  return ONLINE?`<button class="v7-btn ghost" data-run="${esc(p)}" data-lab="otevřít ${esc(z.cislo||z.id)}" title="otevře zakázku a shrne stav">📄 otevřít zakázku</button>`
    :`<button class="v7-btn ghost off" disabled title="jen s běžícím serverem">📄 otevřít zakázku</button>`;
}
function zakazky(v){
  const rows=(DB.pipeline||[]).slice();
  const openRows=rows.filter(z=>z.stavN!=='vyhrano'&&z.stavN!=='prohrano').sort((a,b)=>(b.silentDays||0)-(a.silentDays||0));
  const won=rows.filter(z=>z.stavN==='vyhrano');
  const lost=rows.filter(z=>z.stavN==='prohrano');
  const sorted=[...openRows,...won,...lost];
  let html=`<div class="v7-h"><b>Rozjednané zakázky</b> <span class="v7-sub">${openRows.length} otevřených · ${rows.length} celkem</span> ${ONLINE?'<button class="v7-btn ghost" id="zakNew">➕ nová zakázka</button>':''}</div>`;
  if(!rows.length){
    html+=`<div class="v7-empty">${(!ONLINE&&SNAP)?'Snapshot bez pošty a zakázek — pipeline je jen lokálně.':'Žádné zakázky v pipeline.'}</div>`;
  } else {
    html+='<table class="v7-table"><thead><tr><th>ZAKÁZKA</th><th>KLIENT</th><th>STAV</th><th>POSLEDNÍ POHYB</th><th>ČÁSTKA</th><th>▶</th><th>📋</th></tr></thead><tbody>';
    sorted.forEach(z=>{
      html+=`<tr data-id="${esc(z.id)}">
        <td data-l="ZAKÁZKA"><b>${esc(z.cislo||z.id)}</b>${(z.nazev&&z.nazev!==z.id)?`<br><span class="v7-sub">${esc(z.nazev||'')}</span>`:''}</td>
        <td data-l="KLIENT">${esc(z.klient||'')}</td>
        <td data-l="STAV">${ONLINE?`<select class="v7-sel" data-zid="${esc(z.id)}">${Object.keys(STAV_LABEL).map(k=>`<option value="${k}" ${z.stavN===k?'selected':''}>${STAV_LABEL[k]}</option>`).join('')}</select>`:esc(STAV_LABEL[z.stavN]||z.stavN||'—')}</td>
        <td data-l="POSLEDNÍ POHYB">${esc(z.age||'—')} · <span class="v7-wait ${z.silentDays>10?'w10':z.silentDays>5?'w5':''}">${z.silentDays??'—'} d</span></td>
        <td data-l="ČÁSTKA">${(z.cena!=null&&z.cena!==''&&Number.isFinite(Number(z.cena)))?fmtKc(z.cena):'—'}</td>
        <td data-l="▶">${btnRun(tpl(z),'follow-up '+(z.cislo||z.id))}</td>
        <td data-l="📋">${btnCopy(tpl(z))}</td>
      </tr>`;
      if(zakInlineFor===z.id){
        html+=`<tr class="v7-inline" data-inline="${esc(z.id)}"><td colspan="7"><input class="v7-inp" placeholder="proč? (nepovinné — uloží se jako signál do Labu)"> <button class="v7-btn ghost" data-act="ulozit">uložit</button> <button class="v7-btn ghost" data-act="preskocit">přeskočit</button></td></tr>`;
      }
    });
    html+='</tbody></table>';
  }
  const ukoly=((DB.akce&&DB.akce.rows)||[]).filter(r=>r.typ==='ukol');
  const metaA=(DB.akce&&DB.akce.meta)||{};
  html+='<h3 class="v7-h3">Úkoly makléřům</h3>';
  if(!ukoly.length){
    html+=`<div class="v7-empty">${metaA.kk_ok===false?'kokpity nedostupné':'žádné úkoly od makléřů'}</div>`;
  } else {
    html+=`<table class="v7-table"><thead><tr><th>KDO / CO</th><th>ČEKÁ</th><th>▶</th><th>📋</th></tr></thead><tbody>
      ${ukoly.map(r=>`<tr data-id="${esc(r.id)}">
        <td data-l="KDO / CO"><b>${esc(r.kdo||'')}</b><br><span class="v7-sub">${esc(r.co||'')}</span></td>
        <td data-l="ČEKÁ"><span class="v7-wait ${r.dni>10?'w10':r.dni>5?'w5':''}">${r.dni??'—'} d</span></td>
        <td data-l="▶">${btnRun(r.prompt,r.label)}</td>
        <td data-l="📋">${btnCopy(r.kopie)}</td>
      </tr>`).join('')}
    </tbody></table>`;
  }
  html+=finLine();
  v.innerHTML=html;
  bindBtns('#v7View');
  const zn=$('#zakNew'); if(zn)zn.onclick=()=>{
    const s=prompt('Nová zakázka — klient a co chce (jedna věta):');
    if(s) runPrompt('Nová zakázka z boardu: '+s+'. Založ ji skillem /frantisekdron-nabidka (fáze 1, intake ledger, worth-index) — zakazka.json vytvoř VÝHRADNĚ skillem, ne ručně.','nová zakázka','headless');
  };
  $$('#v7View select.v7-sel').forEach(s=>{s.onclick=e=>e.stopPropagation();s.onchange=()=>setStav(s.dataset.zid,s.value);});
  $$('#v7View tbody tr[data-id]').forEach(tr=>{
    tr.onclick=(e)=>{if(e.target.closest('button')||e.target.closest('select')||e.target.closest('input'))return;
      const z=sorted.find(x=>x.id===tr.dataset.id);
      if(z){zakDrawer(z);return;}
      const u=ukoly.find(x=>x.id===tr.dataset.id);
      if(u)leadDrawer(u);
    };
  });
  $$('#v7View tr.v7-inline').forEach(tr=>{
    const id=tr.dataset.inline;
    const inp=tr.querySelector('.v7-inp');
    tr.querySelectorAll('button').forEach(b=>{
      if(b.dataset.act==='ulozit'){
        b.onclick=()=>{
          const z=rows.find(x=>x.id===id);
          const item={id:'sig-'+Date.now().toString(36),source:'zakazka',source_ref:id,klient:z?z.klient:'',quote:inp.value||'',tema:z?z.stavN:'',milestone_ids:[],date:new Date().toISOString().slice(0,10),evidence_status:'conversation_synthesis'};
          if(ONLINE){
            fetch(API+'/api/lab/upsert',{method:'POST',body:JSON.stringify({entity:'signals',by:'human',item})})
              .then(()=>toast('Signál uložen do Labu')).catch(()=>toast('Uložení selhalo'));
          }
          zakInlineFor=null;route();
        };
      } else if(b.dataset.act==='preskocit'){
        b.onclick=()=>{zakInlineFor=null;route();};
      }
    });
  });
}

function setStav(id,stav){
  const z=(DB.pipeline||[]).find(x=>x.id===id); if(!z)return;
  if(!ONLINE){toast('jen s běžícím serverem');route();return;}
  fetch(API+'/api/pipeline/stav',{method:'POST',body:JSON.stringify({id,stav})})
    .then(async r=>{let j={};try{j=await r.json();}catch(e){}
      if(!r.ok||j.ok===false){toast('Uložení stavu selhalo');route();return;}
      z.stavN=stav;
      zakInlineFor=(stav==='vyhrano'||stav==='prohrano')?id:null;
      toast('Stav uložen');
      if(cur==='zakazky')route();
    }).catch(()=>{toast('Server neodpověděl');route();});
}

//////////////////// NÁPADY / LAB (V4) ////////////////////
function ageDny(ts){ if(!ts) return '—'; const d=Math.floor((Date.now()-ts)/86400000); return d<=0?'dnes':d+' d'; }
function slug(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}
async function labUpsert(entity,item){
  if(!ONLINE){toast('jen s běžícím serverem');return null;}
  try{
    const r=await fetch(API+'/api/lab/upsert',{method:'POST',body:JSON.stringify({entity,item,by:'human'})});
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok||j.ok===false){toast('Uložení selhalo');return null;}
    DB.lab=DB.lab||{};
    const lst=DB.lab[entity]=DB.lab[entity]||[];
    const idx=lst.findIndex(x=>x.id===item.id);
    const merged=j.item||{...(idx>-1?lst[idx]:{}),...item};
    if(idx>-1)lst[idx]=merged; else lst.push(merged);
    return merged;
  }catch(e){toast('Server neodpověděl');return null;}
}
function afterLabWrite(reopenId){
  badges(); if(cur==='napady'||cur==='lab') route();
  if(reopenId && drawerKind==='ms'){
    const fresh=((DB.lab&&DB.lab.milestones)||[]).find(x=>x.id===reopenId);
    if(fresh) msDrawer(fresh);
  }
}

async function ideaNew(){

  if(!t)return;
  if(!ONLINE){copy(t);toast('Server neběží — prompt zkopírován');return;}

async function ideaToMilestone(i){

  if(!nazev)return;
  const mid=slug(nazev)||('m-'+Date.now().toString(36));
  const now=new Date().toISOString().slice(0,10);
  const it=await labUpsert('milestones',{id:mid,title:nazev,phase:'Nápad',status:'idea',priority:50,
    summary:i.t,why:'',next_action:'',next_due:null,evidence_status:'conversation_synthesis',
    related_skills:[],memory_refs:[],zakazka_refs:[],history:[{date:now,what:'z nápadu '+i.id}],
    created:now,updated:now});
  if(!it)return;
  await labUpsert('ideas',{id:i.id,stav:'ano',milestone_id:mid});
  afterLabWrite(null);
  toast('Milník vytvořen');
}
async function ideaToExperiment(i){

        <button class="v7-btn later" data-k="pozdeji">P · později</button><button class="v7-btn ghost" data-k="del">Del · smazat</button>
        <button class="v7-btn ghost" data-k="rozved" title="job: 3 varianty pojetí">🧠 rozveď</button></div>`;
  } else {
    html+='<div class="v7-empty">Schránka je prázdná — ⌘I přidá nový nápad.</div>';

        else if(k==='rozved') ideaRozved(c);
      };
    });
  }
  $$('#v7View [data-iid]').forEach(b=>{

function searchCmdAdd(q){
  q=(q||'').toLowerCase();cmdSel=0;const items=[],st=mapaState,visibleIds=new Set(st?st.visible.map(n=>n.id):[]),M=DB.mapa||{nodes:[]};
  M.nodes.forEach(n=>{
    if(visibleIds.has(n.id)||(q&&!((n.label||'')+' '+(n.d||'')).toLowerCase().includes(q)))return;
    items.push({g:'Skryté uzly',nm:n.label||n.id,ds:MAPA_TYPE_LABEL[n.typ]||n.typ,act:()=>{
      mapaPinned.add(n.id);closeCmd();mapaRebuildState();
      const nn=mapaState.nodesById[n.id];if(nn){mapaSel={kind:'node',id:n.id};mapaSideNode(nn);}
    }});
  });
  ((DB.lab&&DB.lab.ideas)||[]).filter(i=>i.stav==='ano'&&!i.deleted).forEach(i=>{
    if(!(q&&!(i.t||'').toLowerCase().includes(q)))items.push({g:'Nápady (ano)',nm:i.t,ds:'',act:()=>{closeCmd();go('napady');}});
  });
  items.unshift({g:'Nový',nm:'+ nový nápad (jedna věta)',ds:'',act:()=>{
    closeCmd();
    const t=(prompt('Nápad (jedna věta):')||'').trim();if(!t)return;
    if(!ONLINE){copy(t);toast('Server neběží — prompt zkopírován');return;}
    fetch(API+'/api/lab/idea',{method:'POST',body:JSON.stringify({t,zdroj:'mapa',by:'human'})}).then(r=>r.json()).then(j=>{
      DB.lab=DB.lab||{};DB.lab.ideas=DB.lab.ideas||[];DB.lab.ideas.unshift(j);badges();toast('Nápad je ve schránce — roztřiď ho v Nápadech');

function mapaRenderPaths(){

  if(!paths.length){el.innerHTML='<div class="v7-sub">žádné cesty — + cesta ji vytvoří</div>';return;}
  el.innerHTML=paths.map(p=>{
    const steps=(p.steps||[]).map((s,i)=>{
      const cls=s.ok===true?'ok':(s.ok===false?'bad':'unk'),isNext=(s.ok===false&&i===p.dalsi_krok);
      const btn=isNext?` <button class="v7-btn ghost" data-pnext="${esc(p.id)}" data-pidx="${i}">▶</button>`:'';
      return `<span class="v7-step ${cls}">${esc(s.label||s.node)}</span>${btn}`;
    }).join(' → ');
    return `<div class="v7-path"><b data-pname="${esc(p.id)}">${esc(p.name||p.id)}</b> ${steps}</div>`;
  }).join('');
  $$('#mapaPaths [data-pname]').forEach(b=>{b.onclick=()=>mapaHighlightPath(b.dataset.pname);});

    const p=paths.find(x=>x.id===b.dataset.pnext);if(!p)return;const s=p.steps[+b.dataset.pidx];
    act(`Cesta „${p.name}": krok „${s.label}" ještě nestojí (pravidlo ${s.ok_rule}). Navrhni a proveď nejmenší krok, který ho splní.`,'cesta: '+p.name);

async function mapaPathFinish(){

  const name=(prompt('Název cesty:')||'').trim();

  const st=mapaState,steps=mapaPathBuilding.map(id=>{const nn=st.nodesById[id];return {node:id,label:(nn&&nn.label)||id,ok_rule:'nikdy'};});
  const sid=slug(name)||('path-'+Date.now().toString(36)),it=await labUpsert('paths',{id:sid,name,steps});
  mapaPathBuilding=null;const btn=$('#mapaPathNew');if(btn)btn.textContent='+ cesta';
  if(it){
    DB.mapa=DB.mapa||{nodes:[],edges:[],paths:[]};DB.mapa.paths=DB.mapa.paths||[];
    const idx=DB.mapa.paths.findIndex(p=>p.id===sid),merged={id:sid,name,steps:steps.map(s=>({...s,ok:null})),dalsi_krok:null};
    if(idx>-1)DB.mapa.paths[idx]=merged;else DB.mapa.paths.push(merged);

    <div class="v7-mapa-wrap"><canvas id="v7Map"></canvas><aside class="v7-mapa-side" id="mapaSide"></aside></div>
    <div class="v7-sub" id="mapaHiddenLine" style="margin:6px 0 0"></div>
    <div class="v7-mapa-paths" id="mapaPaths"></div>`;
  $('#mapaBack').onclick=()=>{labView='tabulka';mapaSel=null;mapaPathBuilding=null;route();};
  $$('.v7-mapa-bar [data-typ]').forEach(b=>{b.onclick=()=>{const t=b.dataset.typ;if(mapaHidden.has(t))mapaHidden.delete(t);else mapaHidden.add(t);
    try{localStorage.setItem('v7_mapaTypy',JSON.stringify([...mapaHidden]));}catch(e){}
    b.classList.toggle('off',mapaHidden.has(t));mapaRebuildState();};});
  $('#mapaQ').oninput=e=>{mapaQ=e.target.value;mapaRebuildState();};
  $('#mapaFit').onclick=()=>mapaFit();
  $('#mapaAdd').onclick=()=>openCmdAdd();
  $('#mapaPathNew').onclick=()=>{
    if(mapaPathBuilding)mapaPathFinish();
    else{mapaPathBuilding=[];toast('Klikej uzly v pořadí, Enter uloží, Esc zruší');const b=$('#mapaPathNew');if(b)b.textContent='✓ uložit cestu (0)';}
  };
  $('#mapaOnlyLinked').onchange=e=>{mapaOnlyLinked=e.target.checked;mapaRebuildState();};
  $('#mapaOld').onchange=e=>{mapaOld=e.target.checked;try{localStorage.setItem('v7_mapaOld',mapaOld?'1':'0');}catch(e){}mapaRebuildState();};
  mapaRebuildState();mapaSizeCanvas($('#v7Map'));mapaBindCanvas();
  if(mapaSel&&mapaSel.kind==='node'&&mapaState.nodesById[mapaSel.id])mapaSideNode(mapaState.nodesById[mapaSel.id]);
  else if(mapaSel&&mapaSel.kind==='edge'){
    const parts=mapaSel.key.split('|'),e2=mapaState.edges.find(x=>x.a===parts[0]&&x.b===parts[1]&&x.typ===parts[2]);

function searchCmd(q){
  q=(q||'').toLowerCase();cmdSel=0;const items=[];
  ((DB.akce&&DB.akce.rows)||[]).forEach(r=>{if(((r.kdo||'')+(r.co||'')).toLowerCase().includes(q))items.push({g:'Leady',nm:r.kdo,ds:r.co,act:()=>{closeCmd();go('leady');setTimeout(()=>leadDrawer(r),50);}});});
  (DB.pipeline||[]).forEach(z=>{if(((z.nazev||'')+(z.klient||'')).toLowerCase().includes(q))items.push({g:'Zakázky',nm:z.nazev,ds:z.klient,act:()=>{closeCmd();go('zakazky');setTimeout(()=>zakDrawer(z),50);}});});
  ((DB.lab&&DB.lab.milestones)||[]).forEach(m=>{if((m.title||'').toLowerCase().includes(q))items.push({g:'Milníky',nm:m.title,ds:'',act:()=>{closeCmd();go('lab');}});});
  ((DB.lab&&DB.lab.ideas)||[]).forEach(i=>{if((i.t||'').toLowerCase().includes(q))items.push({g:'Nápady',nm:i.t,ds:'',act:()=>{closeCmd();go('napady');}});});
  (DB.skills||[]).forEach(s=>{if((s.name||'').toLowerCase().includes(q))items.push({g:'Skilly',nm:s.name,ds:s.desc||'',act:()=>{closeCmd();skillDrawer(s);}});});
  (DB.memory||[]).forEach(m=>{if((m.name||'').toLowerCase().includes(q))items.push({g:'Paměť',nm:m.name,ds:m.desc||'',act:()=>{closeCmd();memDrawer(m.id||m.name);}});});
  cmdItems=items.slice(0,12);drawCmd();
}
function drawCmd(){
  let g='',h='';
  cmdItems.forEach((it,i)=>{if(it.g!==g){g=it.g;h+=`<div class="v7-cmdgrp">${esc(g)}</div>`;}
    h+=`<div class="v7-cmdrow ${i===cmdSel?'sel':''}" data-i="${i}"><span class="v7-nm">${esc(it.nm||'')}</span><span class="v7-ds">${esc(it.ds||'')}</span></div>`;});
  $('#v7CmdRes').innerHTML=h||'<div class="v7-sub" style="padding:10px 14px">Nic nenalezeno.</div>';
  $$('#v7CmdRes .v7-cmdrow').forEach(r=>{r.onclick=()=>cmdItems[+r.dataset.i].act();r.onmouseenter=()=>{cmdSel=+r.dataset.i;drawCmd();};});
}

//////////////////// zapojení ////////////////////
$$('#v7Tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
$('#v7Scrim').onclick=closeDrawer;
$('#v7Search').onclick=openCmd;
$('#v7CmdIn').oninput=e=>{(cmdMode==='pridat'?searchCmdAdd:searchCmd)(e.target.value);};
$('#v7Cmd').onclick=e=>{if(e.target.id==='v7Cmd')closeCmd();};
// swipe doprava zavře drawer (kopie logiky 3556-3559, nové id)
(()=>{let sx=0,sy=0,t=false;const d=$('#v7Drawer');
  d.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;t=true;},{passive:true});
  d.addEventListener('touchend',e=>{if(!t)return;t=false;const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);
    if(dx>80&&dy<60)closeDrawer();},{passive:true});})();
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='i'){e.preventDefault();ideaNew();}
  if(e.key==='Escape'){closeCmd();closeDrawer();}
  if($('#v7Cmd').classList.contains('on')){
    if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);drawCmd();}
    if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);drawCmd();}
    if(e.key==='Enter'&&cmdItems[cmdSel]){cmdItems[cmdSel].act();}
  }
  if(cur==='lab'&&labView==='mapa'){
    const tgt=(e.target&&e.target.tagName||'').toLowerCase();
    const busy=tgt==='input'||tgt==='textarea'||$('#v7Cmd').classList.contains('on')||$('#v7Drawer').classList.contains('on');
    if(!busy){
      if(e.key==='f'||e.key==='F'){e.preventDefault();mapaFit();}
      else if(e.key==='Escape'){
        if(mapaPathBuilding){mapaPathBuilding=null;const b=$('#mapaPathNew');if(b)b.textContent='+ cesta';toast('Zrušeno');}
        else{mapaSel=null;mapaSideDefault();}
      }
      else if(e.key==='Enter'&&mapaPathBuilding){e.preventDefault();mapaPathFinish();}
    }
  }
  if(cur==='napady'){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const tgt=(e.target&&e.target.tagName||'').toLowerCase();
    const busy=tgt==='input'||tgt==='textarea'||$('#v7Cmd').classList.contains('on')||$('#v7Drawer').classList.contains('on');
    if(!busy){
      const inb=((DB.lab&&DB.lab.ideas)||[]).filter(i=>!i.deleted&&i.stav==='inbox');
      const c=inb[0];
      if(c){
        const k=e.key.toLowerCase();
        if(k==='a'){e.preventDefault();ideaStav(c.id,'ano');}
        else if(k==='n'){e.preventDefault();ideaStav(c.id,'ne');}
        else if(k==='p'){e.preventDefault();ideaStav(c.id,'pozdeji');}
        else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();ideaDel(c.id);}
        else if(e.key==='Enter'){e.preventDefault();ideaRozved(c);}
      }
    }
  }
});
if(location.hash.slice(1) in SECTORS)cur=location.hash.slice(1);
$$('#v7Tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
try{if(localStorage.getItem('fdb_theme')==='light')document.documentElement.setAttribute('data-t','light');}catch(e){}
boot();
</script>
</body></html>
