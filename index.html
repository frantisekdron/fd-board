<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FD BOARD — řídicí stanice</title>
<style>
@font-face{font-family:'B612';src:url('fonts/B612-Regular.ttf');font-weight:400;font-display:swap}
@font-face{font-family:'B612';src:url('fonts/B612-Bold.ttf');font-weight:700;font-display:swap}
@font-face{font-family:'B612 Mono';src:url('fonts/B612Mono-Regular.ttf');font-weight:400;font-display:swap}
@font-face{font-family:'B612 Mono';src:url('fonts/B612Mono-Bold.ttf');font-weight:700;font-display:swap}
:root{
  --bg:#0a0e12; --bg2:#0d1319; --panel:#111820; --panel2:#0f151c; --grid:#1b2530;
  --edge:#223040; --ink:#d6e0e8; --dim:#6b7a88; --dim2:#465562;
  --sk:#35e0d0; --me:#b28bff; --da:#f5b73d; --se:#5b8dff; --pr:#46d17f; --brand:#ff5a5f;
  --re:#ff8a5b; --pg:#ff6ad5;
  --hov:#ffffff08; --hov2:#ffffff0d; --on-accent:#0a0e12; --bg-glow:#12202a; --bg-deep:#080b0f;
  --warn-ink:#f5d79a; --cv-node:#0d141b; --cv-dot:rgba(255,255,255,0.05);
  --cv-tip:rgba(10,14,18,0.92); --cv-label:#e8f0f6;
  --mono:"B612 Mono","SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:"B612",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
/* DEN režim — denní kokpit: teplá papírová šedá, ztmavené akcenty (neon na bílé nečte) */
html[data-t=light]{
  --bg:#e9e6de; --bg2:#e0ddd3; --panel:#f4f2ea; --panel2:#ebe8df; --grid:#d8d4c8;
  --edge:#c6c1b2; --ink:#20261f; --dim:#5c6157; --dim2:#8b9083;
  --sk:#0f7d72; --me:#6d3fc4; --da:#a8650a; --se:#2454c9; --pr:#1e7c46;
  --brand:#d03a3f; --re:#bb4c17; --pg:#b52377;
  --hov:#00000006; --hov2:#0000000d; --on-accent:#f4f2ea; --bg-glow:#dfe6e2; --bg-deep:#d8d4c8;
  --warn-ink:#7a5a10; --cv-node:#f4f2ea; --cv-dot:rgba(0,0,0,0.07);
  --cv-tip:rgba(244,242,234,0.95); --cv-label:#20261f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit}
table{border-collapse:collapse;width:100%}

/* ===== v7 skelet ===== */
.v7-app{position:relative;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.v7-top{position:relative;height:46px;flex:0 0 46px;display:flex;align-items:center;gap:18px;
  padding:0 16px;border-bottom:1px solid var(--edge);background:var(--panel)}
.v7-brand{font-family:var(--sans);font-weight:800;font-size:14px;letter-spacing:.5px;white-space:nowrap}
.v7-brand b{color:var(--brand)}
.v7-tabs{display:flex;gap:2px;overflow-x:auto;flex:1;height:100%}
.v7-tabs button{all:unset;cursor:pointer;display:flex;align-items:center;padding:0 12px;height:100%;
  font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);white-space:nowrap;
  border-bottom:2px solid transparent}
.v7-tabs button:hover{color:var(--ink)}
.v7-tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.v7-n{display:inline-block;margin-left:5px;min-width:14px;padding:0 4px;border-radius:8px;background:var(--brand);
  color:#fff;font-size:9px;line-height:15px;text-align:center;font-weight:700}
.v7-ico{all:unset;cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--dim);font-size:15px}
.v7-ico:hover{background:var(--hov);color:var(--ink)}
.v7-main{flex:1;overflow:auto;padding:12px 18px 60px}
.v7-foot{flex:0 0 auto;height:28px;display:flex;align-items:center;gap:0;padding:0 16px;
  border-top:1px solid var(--edge);background:var(--panel);color:var(--dim);font-size:11px;
  overflow-x:auto;white-space:nowrap}
.v7-foot a{color:var(--dim);text-decoration:none;cursor:pointer}
.v7-foot a:hover{color:var(--ink);text-decoration:underline}

/* ===== hlavička sekce ===== */
.v7-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.v7-h b{font-family:var(--sans);font-size:15px;font-weight:800}
.v7-h3{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:var(--dim);margin:18px 0 8px}
.v7-sub{color:var(--dim);font-size:11.5px}
.v7-stamp{font-size:11px;color:var(--dim);margin-left:auto}
.v7-stamp.bad{color:var(--brand)}

/* ===== varování ===== */
.v7-warn{background:color-mix(in srgb, var(--brand) 12%, transparent);border-left:3px solid var(--brand);
  color:var(--warn-ink);padding:7px 12px;font-size:11.5px;margin:0 0 10px;border-radius:2px}
.v7-warn.soft{background:var(--hov2);border-left-color:var(--dim2);color:var(--dim)}

/* ===== V9: leady chipy + štítek NOVÝ + Claude stav ===== */
.v7-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.v7-badge-new{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;background:var(--pr);
  color:var(--on-accent);font-size:9px;font-weight:700;letter-spacing:.5px;vertical-align:middle}
.v7-warnicon{cursor:help;margin-left:5px;color:var(--da)}
.v7-authdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.v7-authdot.ok{background:var(--pr)}
.v7-authdot.bad{background:var(--brand)}
.v7-authdot.unk{background:var(--dim2)}

/* ===== tabulka ===== */
.v7-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);
  padding:6px 8px;border-bottom:1px solid var(--edge)}
.v7-table td{padding:8px;font-size:12px;border-bottom:1px solid var(--grid);vertical-align:top}
.v7-table tbody tr{cursor:pointer}
.v7-table tbody tr:hover{background:var(--hov)}
.v7-table tr.v7-inline{cursor:default}
.v7-table tr.v7-inline:hover{background:transparent}
.v7-table tr.v7-inline td{padding:8px}

/* ===== tlačítka ===== */
.v7-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  padding:3px 8px;border-radius:5px;font-size:12px;line-height:1.4}
.v7-btn.run{background:var(--pr);color:var(--on-accent);font-weight:700}
.v7-btn.run:hover{filter:brightness(1.08)}
.v7-btn.run.off{background:transparent;border:1px solid var(--edge);color:var(--dim2);cursor:not-allowed}
.v7-btn.ghost{background:transparent;border:1px solid var(--edge);color:var(--dim)}
.v7-btn.ghost:hover{color:var(--ink);border-color:var(--dim2)}

/* ===== čekání ===== */
.v7-wait{color:var(--dim)}
.v7-wait.w5{color:var(--da)}
.v7-wait.w10{color:var(--brand);font-weight:700}

/* ===== V4: nápady + lab ===== */
.v7-keys{color:var(--dim);font-size:10.5px;margin-left:auto;white-space:nowrap}
.v7-napad{font-size:16px;line-height:1.5;padding:18px;border:1px solid var(--edge);border-radius:8px;
  background:var(--panel);margin-bottom:10px}
.v7-napad-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.v7-btn.yes{background:var(--pr);color:var(--on-accent);font-weight:700}
.v7-btn.yes:hover{filter:brightness(1.08)}
.v7-btn.no{background:var(--brand);color:#fff;font-weight:700}
.v7-btn.no:hover{filter:brightness(1.08)}
.v7-btn.later{background:var(--da);color:var(--on-accent);font-weight:700}
.v7-btn.later:hover{filter:brightness(1.08)}
.v7-chk{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px;margin-left:auto;cursor:pointer}
.v7-list{margin:14px 0;border:1px solid var(--edge);border-radius:8px;padding:2px 12px;background:var(--panel2)}
.v7-list summary{cursor:pointer;padding:10px 0;font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:var(--dim);font-weight:700;list-style:none}
.v7-list summary::-webkit-details-marker{display:none}
.v7-list summary::before{content:'▸ ';display:inline-block}
.v7-list[open] summary::before{content:'▾ '}
.v7-idearow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--grid);font-size:12px}
.v7-idearow:last-child{border-bottom:none}
.v7-idearow .t{flex:1;min-width:0}
.v7-idearow .src{color:var(--dim);font-size:10.5px;white-space:nowrap}
.v7-idearow .btns{display:flex;gap:4px;flex-shrink:0}
.v7-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ===== prázdné stavy ===== */
.v7-empty{color:var(--dim);padding:28px;text-align:center;border:1px dashed var(--edge);border-radius:8px;font-size:12.5px}
.v7-empty.bad{color:var(--brand);border-color:var(--brand)}

/* ===== drobnosti ===== */
.v7-mono{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--edge);
  border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;margin:10px 0}
.v7-sel{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:5px;padding:3px 6px;font-size:12px}
.v7-inp{background:var(--panel2);border:1px solid var(--edge);color:var(--ink);border-radius:5px;padding:5px 8px;
  font-size:12px;width:min(360px,60%)}
.v7-drow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--grid);
  font-size:12px}
.v7-drow span:first-child{color:var(--dim)}
.v7-drow.v7-click{cursor:pointer}
.v7-drow.v7-click:hover{background:var(--hov)}
.v7-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ===== V5: mapa ===== */
.v7-mapa-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.v7-chip{all:unset;cursor:pointer;padding:3px 10px;border-radius:12px;font-size:11px;border:1px solid var(--edge);color:var(--ink)}
.v7-chip.off{color:var(--dim2);opacity:.55}
.v7-chip:hover{border-color:var(--dim2)}
#mapaQ{background:var(--panel2);border:1px solid var(--edge);border-radius:5px;padding:5px 8px;color:var(--ink);font-size:12px;width:150px}
.v7-mapa-bar label{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px;margin-left:auto;white-space:nowrap}
.v7-mapa-wrap{position:relative;height:min(70vh,720px);border:1px solid var(--edge);border-radius:8px;overflow:hidden;background:var(--panel2)}
.v7-mapa-wrap canvas{display:block;width:100%;height:100%}
.v7-mapa-side{position:absolute;right:0;top:0;width:min(340px,42%);height:100%;overflow:auto;
  background:var(--panel);border-left:1px solid var(--edge);padding:14px}
.v7-mapa-paths{margin-top:14px}
.v7-path{padding:8px 0;border-bottom:1px solid var(--grid);font-size:12px;cursor:pointer}
.v7-path b{cursor:pointer}
.v7-path b:hover{text-decoration:underline}
.v7-step{display:inline-block;margin:2px 3px 2px 0;padding:2px 8px;border-radius:10px;font-size:10.5px;
  border:1px solid var(--edge);color:var(--dim)}
.v7-step.ok{border-color:var(--pr);color:var(--pr)}
.v7-step.bad{border-color:var(--brand);color:var(--brand)}
.v7-step.unk{border-color:var(--dim2)}

/* ===== drawer + scrim ===== */
.v7-scrim{position:absolute;inset:0;background:#000a;opacity:0;pointer-events:none;transition:.2s;z-index:19}
.v7-scrim.on{opacity:1;pointer-events:auto}
.v7-drawer{position:absolute;top:0;right:0;height:100%;width:min(520px,94vw);transform:translateX(100%);
  transition:.2s;background:var(--bg2);border-left:1px solid var(--edge);overflow:auto;z-index:20}
.v7-drawer.on{transform:none}
.v7-dhead{position:relative;padding:16px 40px 14px 18px;border-bottom:2px solid var(--dc,var(--edge))}
.v7-dhead .v7-dclose{position:absolute;top:12px;right:12px}
.v7-dclose{all:unset;cursor:pointer;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--dim)}
.v7-dclose:hover{background:var(--hov);color:var(--ink)}
.v7-dkicker{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dc,var(--dim))}
.v7-dhead h2{font-family:var(--sans);font-size:17px;font-weight:800;margin-top:4px}
.v7-dbody{padding:16px 18px 30px}
.v7-dbody p{font-size:12.5px;line-height:1.6;margin-bottom:10px}

/* ===== příkazová paleta ===== */
.v7-cmd{position:absolute;top:56px;left:50%;transform:translateX(-50%);width:min(560px,92vw);
  background:var(--panel);border:1px solid var(--edge);border-radius:10px;box-shadow:0 20px 60px #000a;
  z-index:30;display:none;overflow:hidden}
.v7-cmd.on{display:block}
.v7-cmd input{width:100%;background:var(--panel2);border:none;border-bottom:1px solid var(--edge);
  padding:12px 14px;outline:none;font-size:13px}
#v7CmdRes{max-height:50vh;overflow:auto;padding:6px 0}
.v7-cmdgrp{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:8px 14px 2px}
.v7-cmdrow{display:flex;justify-content:space-between;gap:10px;padding:7px 14px;cursor:pointer;font-size:12.5px}
.v7-cmdrow.sel,.v7-cmdrow:hover{background:var(--hov)}
.v7-cmdrow .v7-ds{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:700px){
  .v7-tabs{-webkit-overflow-scrolling:touch}
  .v7-table thead{display:none}
  .v7-table,.v7-table tbody,.v7-table tr,.v7-table td{display:block;width:100%}
  .v7-table tr{border:1px solid var(--edge);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--panel)}
  .v7-table tr.v7-inline{padding:8px 10px}
  .v7-table td{border-bottom:none;padding:3px 0;display:flex;flex-direction:column;gap:2px}
  .v7-table td[data-l]::before{content:attr(data-l);color:var(--dim);font-size:9px;letter-spacing:1px;text-transform:uppercase}
  .v7-table td[data-l="ZA KOLIK"]:empty{display:none}
  .v7-table td[data-l="▶"],.v7-table td[data-l="📋"]{display:inline-flex;width:auto;padding-right:10px}
  .v7-table td[data-l="▶"]::before,.v7-table td[data-l="📋"]::before{content:none}
  .v7-drawer{width:100vw}
  .v7-mapa-side{position:static;width:100%;height:auto;border-left:none;border-top:1px solid var(--edge)}
  .v7-mapa-wrap{height:60vh;max-width:100%;overflow:auto}
  .v7-napad{font-size:15px;padding:14px}
  .v7-napad-btns{flex-wrap:nowrap;overflow-x:auto;gap:6px;padding-bottom:2px}
  .v7-napad-btns .v7-btn{flex:0 0 auto}
  .v7-idearow{flex-direction:column;align-items:stretch;gap:6px}
  .v7-idearow .t{width:100%}
  .v7-idearow .btns{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
  .v7-idearow .btns .v7-btn{flex:0 0 auto}
}

<body>
<div id="pwgate" style="display:none;position:fixed;inset:0;z-index:99;background:radial-gradient(120% 90% at 50% 10%,#12202a 0,#0a0e12 70%);align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:34px 36px;max-width:360px;text-align:center">
    <div style="font-family:var(--sans);font-weight:800;font-size:22px">FD <span style="color:var(--brand)">BOARD</span></div>
    <div style="color:var(--dim);font-size:11px;letter-spacing:2px;margin:6px 0 18px;text-transform:uppercase">Pozemní řídicí stanice</div>
    <input id="pwin" type="password" placeholder="Heslo" autocomplete="off" style="width:100%;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:11px 14px;color:var(--ink);font-family:var(--mono);font-size:14px;outline:none;text-align:center">
    <label style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;color:var(--dim);font-size:11px;cursor:pointer"><input id="pwremember" type="checkbox" style="cursor:pointer"> pamatovat heslo na tomto zařízení</label>
    <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--edge);text-align:left">
      <div style="color:var(--dim);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px">Připojit k Macu</div>
      <input id="pgRemoteUrl" type="text" placeholder="Adresa Macu (https://…)" autocomplete="off" style="width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:12px;outline:none;margin-bottom:6px">
      <input id="pgRemoteTok" type="password" placeholder="Token" autocomplete="off" style="width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--edge);border-radius:8px;padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:12px;outline:none;margin-bottom:8px">
      <div style="display:flex;gap:6px">
        <button id="pgRemoteConn" type="button" class="v7-btn" style="flex:1;font-size:11px">Připojit</button>
        <button id="pgRemoteDisc" type="button" class="v7-btn ghost" style="flex:1;font-size:11px">Odpojit</button>
      </div>
      <div id="pgRemoteState" style="color:var(--dim);font-size:10px;margin-top:7px;min-height:12px"></div>
      <div style="color:var(--dim);font-size:10px;margin-top:9px;line-height:1.45">Plná verze online potřebuje zapnutý Mac a tunel (Tailscale Funnel). Adresa + token jsou v Zázemí lokálního boardu.</div>
    </div>
    <button id="pwbtn" type="button" style="all:unset;cursor:pointer;margin-top:14px;width:100%;box-sizing:border-box;text-align:center;background:var(--brand);color:#fff;font-weight:700;font-family:var(--mono);padding:11px;border-radius:8px">Vstoupit →</button>
    <div id="pwerr" style="color:var(--brand);font-size:11px;margin-top:10px;min-height:14px"></div>
  </div>
</div>

<script>
//////////////////// stav ////////////////////
const SECTORS={leady:1,zakazky:1,napady:1,lab:1};
let DB=null, ONLINE=false, API='', cur='leady', JOBS=[], SNAP='', jobPoll=0, drawerKind=null, FIN=null;
let REMOTE=false, REMOTE_TOKEN='', REMOTE_AUTH_FAIL=false, authFailShown=false;
let doneHandled=new Set(); // V9 fix: id jobů, jejichž onJobFinished už proběhl — brání dvojímu zpracování při překrývajících se refreshJobs()
let CLAUDE_AUTH=null, curLeadRow=null;
let bootRetry=0, zakInlineFor=null, cmdSel=0, cmdItems=[], cmdMode='search';
let labView='tabulka';
let mapaHidden=new Set(), mapaOnlyLinked=true, mapaQ='', mapaPinned=new Set(), mapaSel=null, mapaOld=false;
let mapaState=null, mapaView={x:0,y:0,k:1,inited:false}, mapaRAF=0, mapaHoverNode=null, mapaHoverEdgeIdx=-1;
let mapaPathBuilding=null, mapaPathHighlight=null;

const SEED={akce:{rows:[],meta:{}},pipeline:[],lab:{},mapa:{nodes:[],edges:[],paths:[]},jobs:[],brief:{},overview:{},skills:[],memory:[],data:[],registry:{},settings:{},artifacts:[],degraded:[]};

//////////////////// util (kopie z FD_BOARD_full.html) ////////////////////
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); // ⌘K bez diakritiky
function copy(t){if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>toast('Zkopírováno do schránky')).catch(()=>toast('Zkopíruj ručně'));}else toast('Schránka nedostupná');}
let toastT;function toast(m){let el=$('#toastEl');if(!el){el=document.createElement('div');el.id='toastEl';el.style.cssText='position:fixed;bottom:18px;right:18px;background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--sk);color:var(--ink);padding:9px 14px;border-radius:4px;font-size:11.5px;z-index:50;transition:.3s;box-shadow:0 10px 30px #000a;font-family:var(--mono)';document.body.appendChild(el);}el.textContent='▸ '+new Date().toLocaleTimeString('cs',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+'  '+m;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2600);}
function fmtKc(n){const v=Number(n);return Number.isFinite(v)?Math.round(v).toLocaleString('cs-CZ')+' Kč':esc(String(n));}
function fmtAgeH(h){return h<48?h+' h':Math.round(h/24)+' d';}
function baseName(p){return (p||'').replace(/\/+$/,'').split('/').pop();}
function dirName(p){const parts=(p||'').replace(/\/+$/,'').split('/');parts.pop();return parts.join('/');}
function degNames(list){return [...new Set((list||[]).map(d=>typeof d==='string'?d:(d.name||d.file||'?')))];}

//////////////////// vzdálený přístup (v7_remote: {url, token}) ////////////////////
function remoteGet(){try{const v=JSON.parse(localStorage.getItem('v7_remote')||'null');return (v&&v.url&&v.token)?v:null;}catch(e){return null;}}
function remoteSet(url,token){try{localStorage.setItem('v7_remote',JSON.stringify({url:String(url||'').trim(),token:String(token||'').trim()}));}catch(e){}}
function remoteClear(){try{localStorage.removeItem('v7_remote');}catch(e){}}
// centrální fetch pro všechna API volání — v REMOTE režimu vždy přidá X-FD-Token; při 401 spadne do snapshotu
async function apiFetch(path,opts){
  opts=Object.assign({},opts);
  const headers=Object.assign({},opts.headers||{});
  if(REMOTE&&REMOTE_TOKEN)headers['X-FD-Token']=REMOTE_TOKEN;
  opts.headers=headers;
  const r=await fetch(API+path,opts);
  if(r.status===401)onRemoteAuthFail();
  return r;
}
function onRemoteAuthFail(){
  if(!REMOTE||authFailShown)return;
  authFailShown=true;
  toast('Token nesedí — nastav v Zázemí');
  REMOTE=false;REMOTE_TOKEN='';ONLINE=false;
  if(window.FD_BAKED){DB=FD_BAKED.all;SNAP=FD_BAKED.stamp||'';}
  paticka();if(cur)route();
}

//////////////////// spojení / offline / snapshot (kopie 1047-1098) ////////////////////
async function connect(){
  authFailShown=false;REMOTE_AUTH_FAIL=false;
  const rem=location.protocol.startsWith('http')?remoteGet():null;
  if(rem){
    const base=rem.url.replace(/\/+$/,'');
    try{
      const p=await fetch(base+'/api/ping',{cache:'no-store',headers:{'X-FD-Token':rem.token}});
      if(p.ok){
        const r=await fetch(base+'/api/all',{cache:'no-store',headers:{'X-FD-Token':rem.token}});
        if(r.status===401){REMOTE_AUTH_FAIL=true;}
        else if(r.ok){API=base;REMOTE=true;REMOTE_TOKEN=rem.token;return await r.json();}
      }
    }catch(e){}
  }
  REMOTE=false;REMOTE_TOKEN='';
  const onPages=/github\.io$/i.test(location.hostname);const bases=location.protocol.startsWith('http')?(onPages?['http://127.0.0.1:8777']:['','http://127.0.0.1:8777']):['http://127.0.0.1:8777','http://localhost:8777'];
  for(const b of bases){try{const r=await fetch(b+'/api/all',{cache:'no-store'});if(r.ok){API=b;return await r.json();}}catch(e){}}
  return null;
}
async function unlock(pw){
  const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),E=window.FD_ENC;
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.salt),iterations:200000,hash:'SHA-256'},
    km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.iv)},key,b(E.data));
  window.FD_BAKED=JSON.parse(new TextDecoder().decode(pt));
}
function gateEnc(){return new Promise(res=>{
  const g=$('#pwgate');
  let savedLocal='';try{savedLocal=localStorage.getItem('v7_pw')||'';}catch(e){}
  const attempt=async pw=>{try{await unlock(pw);sessionStorage.setItem('fdb_key',pw);
      if($('#pwremember')&&$('#pwremember').checked){try{localStorage.setItem('v7_pw',pw);}catch(e){}}
      g.style.display='none';res();return true;}
    catch(e){sessionStorage.removeItem('fdb_key');try{localStorage.removeItem('v7_pw');}catch(e2){}return false;}};
  (async()=>{
    // pořadí: localStorage (zapamatováno) → sessionStorage (tato relace) → dotaz
    if(savedLocal&&await attempt(savedLocal))return;
    const savedSession=sessionStorage.getItem('fdb_key');
    if(savedSession&&savedSession!==savedLocal&&await attempt(savedSession))return;
    g.style.display='flex';
    const tryit=async()=>{if(!(await attempt($('#pwin').value))){$('#pwerr').textContent='Špatné heslo.';$('#pwin').value='';}};
    $('#pwbtn').onclick=tryit;$('#pwin').onkeydown=e=>{if(e.key==='Enter')tryit();};
    setTimeout(()=>$('#pwin').focus(),50);
  })();
});}
async function verCheck(){
  if(location.protocol==='file:')return;
  if(!window.FD_BUILD||!window.FD_ENC)return;
  try{const r=await fetch('version.json?ts='+Date.now(),{cache:'no-store'});
    const v=(await r.json()).build;
    if(v&&v!==window.FD_BUILD){toast('Nová verze — načítám…');setTimeout(()=>location.replace(location.pathname+'?v='+v),900);}
  }catch(e){}
}
function startRetry(){
  if(bootRetry)return;
  bootRetry=setInterval(async()=>{
    const d=await connect();
    if(d){clearInterval(bootRetry);bootRetry=0;DB=d;ONLINE=true;
      finalize(true);toast(REMOTE?'✓ Připojeno k Macu — živá data':'✓ Připojeno k serveru — živá data');}
  },4000);
}
async function footerRetry(){
  toast('Zkouším se připojit…');
  const d=await connect();
  if(d){DB=d;ONLINE=true;finalize(true);toast(REMOTE?'✓ Připojeno k Macu — živá data':'✓ Připojeno — živá data');}
  else{toast(REMOTE_AUTH_FAIL?'Token nesedí — nastav v Zázemí':'Mac nedostupný');paticka();}
}

//////////////////// boot ////////////////////
async function boot(){ if(window.FD_ENC){await gateEnc();verCheck();setInterval(verCheck,300000);}
  const d=await connect(); if(d){DB=d;ONLINE=true;}
  else if(window.FD_BAKED){DB=FD_BAKED.all;ONLINE=false;SNAP=FD_BAKED.stamp||'';if(REMOTE_AUTH_FAIL)toast('Token nesedí — nastav v Zázemí');}
  else{DB=SEED;ONLINE=false;startRetry();}
  finalize(true);}
async function finalize(rerender){
  DB.akce=DB.akce||{rows:[],meta:{}}; DB.lab=DB.lab||{}; DB.mapa=DB.mapa||{nodes:[],edges:[],paths:[]}; DB.pipeline=DB.pipeline||[]; DB.degraded=DB.degraded||[];
  if(ONLINE){try{FIN=await (await apiFetch('/api/data?id=faktury')).json();}catch(e){FIN=null;} JOBS=DB.jobs||[]; await fetchClaudeAuth(); refreshJobs();}
  else if(window.FD_BAKED){FIN=(FD_BAKED.details||{}).faktury||null;}
  badges(); paticka(); if(rerender)route();}
function badges(){ const L=DB.lab||{}; $('#nNapady').textContent=((L.ideas||[]).filter(i=>i.stav==='inbox'&&!i.deleted).length)||''; $('#nLab').textContent=((L.milestones||[]).filter(m=>!m.deleted&&['build','test'].includes(m.status)).length)||''; }
function go(t){cur=t;$$('#v7Tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));location.hash=t;route();}
function route(){if(!DB)return;const v=$('#v7View');v.innerHTML='';({leady,zakazky,napady,lab}[cur]||leady)(v);}
addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(SECTORS[t]&&t!==cur)go(t);});

//////////////////// joby ////////////////////
async function runPrompt(prompt,label,kind){
  if(!ONLINE){copy(prompt);return;}
  try{
    const r=await apiFetch('/api/run',{method:'POST',body:JSON.stringify({prompt,label,kind:kind||'terminal'})});
    const j=await r.json();
    if(r.status===409){toast('Běží už 2 joby — počkej.');return;}
    if(!j.ok){toast('Nespuštěno: '+(j.err||'?'));return;}
    toast('▶ spuštěno');
    if(kind==='headless')refreshJobs();
  }catch(e){toast('Server neodpověděl');copy(prompt);}
}
async function jobOutput(id){
  try{const full=await (await apiFetch('/api/jobs?id='+encodeURIComponent(id))).json();return (full.out||[]).join('\n');}
  catch(e){return '';}
}
async function handleRozvedDone(j){
  try{
    const text=await jobOutput(j.id);
    const varianty=text.split('\n').map(l=>l.trim()).filter(l=>/^[-–•]/.test(l)).map(l=>l.replace(/^[-–•]\s*/,'')).slice(0,5);
    if(!varianty.length){toast('Rozveď hotovo, ale varianty se nepodařilo rozpoznat');return;}
    const short=(j.label||'').replace('rozveď: ','');
    const it=((DB.lab&&DB.lab.ideas)||[]).find(x=>(x.t||'').slice(0,24)===short);
    if(!it){toast('🧠 Varianty hotové, ale nápad už nenalezen');return;}
    const saved=await labUpsert('ideas',{id:it.id,varianty});
    if(saved){toast('🧠 Varianty připraveny');if(cur==='napady')route();}
  }catch(e){toast('Chyba při zpracování variant');}
}
async function onJobFinished(j){
  if((j.label||'').indexOf('odpověď: ')===0){
    if(j.state==='done'){toast('✓ Odpověď připravena — 📋 v detailu leadu');}
    else toast('✕ Chyba: '+(j.label||j.id));
    if(drawerKind==='lead')refreshLeadDrawerJob();
    return;
  }
  if((j.label||'').indexOf('rozveď: ')===0){
    if(j.state==='done'){await handleRozvedDone(j);}
    else toast('✕ Chyba: '+(j.label||j.id));
    return;
  }
  toast((j.state==='done'?'✓ Hotovo: ':'✕ Chyba: ')+(j.label||j.id));
}
async function refreshJobs(){
  if(!ONLINE)return;
  const prevById={}; (JOBS||[]).forEach(j=>{prevById[j.id]=j.state;});
  try{const jj=await (await apiFetch('/api/jobs',{cache:'no-store'})).json();JOBS=Array.isArray(jj)?jj:[];}catch(e){return;}
  paticka();
  if(drawerKind==='zazemi')zazemiDrawer();
  if(drawerKind==='lead')refreshLeadDrawerJob();
  for(const j of JOBS){
    if(prevById[j.id]==='running'&&j.state&&j.state!=='running'&&!doneHandled.has(j.id)){
      doneHandled.add(j.id);
      await onJobFinished(j);
    }
  }
  clearTimeout(jobPoll);
  const run=JOBS.filter(j=>j.state==='running').length;
  if(run>0)jobPoll=setTimeout(refreshJobs,2000);
}
//////////////////// stav Clauda (patička) ////////////////////
async function fetchClaudeAuth(){
  if(!ONLINE){CLAUDE_AUTH=null;return;}
  try{const s=await (await apiFetch('/api/state',{cache:'no-store'})).json();CLAUDE_AUTH=(s&&s.claude_auth)||null;}
  catch(e){CLAUDE_AUTH=null;}
}
async function claudeProbe(){
  if(!ONLINE){toast('jen s běžícím serverem');return;}
  toast('Sonda spuštěna…');
  try{await apiFetch('/api/claude/probe',{method:'POST',body:'{}'});}catch(e){}
  await fetchClaudeAuth();
  paticka();
}

//////////////////// akce / tlačítka ////////////////////
function act(prompt,label){ if(ONLINE) return runPrompt(prompt,label,'headless'); copy(prompt); toast('Server neběží — prompt zkopírován'); }
function btnRun(prompt,label,title){ return ONLINE? `<button class="v7-btn run" data-run="${esc(prompt)}" data-lab="${esc(label)}" title="${esc(title||'spustí Clauda na pozadí')}">▶</button>` : `<button class="v7-btn run off" disabled title="jen s běžícím serverem — použij 📋">▶</button>`; }
function btnCopy(text){ return `<button class="v7-btn ghost" data-p="${esc(text)}" title="zkopíruje hotový text">📋</button>`; }
function bindBtns(sel){
  $$(sel+' [data-run]:not(.off)').forEach(b=>{b.onclick=e=>{e.stopPropagation();act(b.dataset.run,b.dataset.lab);};});
  $$(sel+' [data-p]').forEach(b=>{b.onclick=e=>{e.stopPropagation();copy(b.dataset.p);};});
}

//////////////////// drawer (přepis na v7 id/třídy, kopie logiky 3548-3559) ////////////////////
function drawer(k,title,cvar,html){
  $('#v7DrawerC').innerHTML=`<div class="v7-dhead" style="--dc:var(${cvar})"><button class="v7-dclose" onclick="closeDrawer()">✕</button>
    <div class="v7-dkicker">${esc(k)}</div><h2>${esc(title)}</h2></div><div class="v7-dbody">${html}</div>`;
  $('#v7Drawer').classList.add('on');$('#v7Scrim').classList.add('on');
}
function closeDrawer(){$('#v7Drawer').classList.remove('on');$('#v7Scrim').classList.remove('on');drawerKind=null;curLeadRow=null;}

//////////////////// LEADY ////////////////////
const LEADY_CHIPS=[['vse','vše',null],['nove','nové',null],['poptavky','poptávky','poptavka'],['zakazky','zakázky','ticho'],['trh','trh','sleva'],['projekty','projekty','projekt']];
function leadyGetFilter(){let f='vse';try{f=localStorage.getItem('v7_leadyFilter')||'vse';}catch(e){}return LEADY_CHIPS.some(c=>c[0]===f)?f:'vse';}
function leadyApplyFilter(rows,f){
  if(f==='vse')return rows;
  if(f==='nove')return rows.filter(r=>r.dni!=null&&r.dni<=3);
  const typ=(LEADY_CHIPS.find(c=>c[0]===f)||[])[2];
  return typ?rows.filter(r=>r.typ===typ):rows;
}
function leady(v){
  const akce=DB.akce||{rows:[],meta:{}};
  const allRows=akce.rows||[];
  const meta=akce.meta||{};
  const curFilter=leadyGetFilter();
  const rows=leadyApplyFilter(allRows,curFilter);
  const posta=meta.posta_stara_h;
  const stampCls=(posta==null||posta>12)?'bad':'';
  const degList=degNames([...(meta.degraded||[]),...(DB.degraded||[])]);
  let html=`<div class="v7-h"><b>Komu dnes volat</b> <span class="v7-sub">${rows.length}${curFilter!=='vse'?(' z '+allRows.length):''} řádků · řazení: ${esc(meta.razeni||'typ → dny čekání → částka')}</span>
    <span class="v7-stamp ${stampCls}">pošta: poslední zpráva ${posta==null?'—':'před '+fmtAgeH(posta)}</span>
    ${ONLINE?'<button class="v7-btn ghost" id="postaRefresh" title="spustí analýzu schránky honza@ (job)">↻ obnov poštu</button>':''}</div>`;
  html+=`<div class="v7-chips">${LEADY_CHIPS.map(c=>{const n=leadyApplyFilter(allRows,c[0]).length;if(!n&&c[0]!=='vse'&&curFilter!==c[0])return '';return `<button class="v7-chip ${curFilter===c[0]?'':'off'}" data-lf="${c[0]}">${esc(c[1])} <span class="v7-chipn">${n}</span></button>`;}).join('')}</div>`;
  if(degList.length){
    html+=`<div class="v7-warn">⚠ Poškozený zdroj: ${esc(degList.join(', '))} — řádky z něj chybí, ticho v tabulce není klid.</div>`;
  }
  if(!meta.kk_ok && ONLINE){
    html+='<div class="v7-warn soft">kokpity makléřů nedostupné — úkoly makléřů chybí</div>';
  }
  if(!allRows.length){
    if(!ONLINE && SNAP){
      html+='<div class="v7-empty">Snapshot bez pošty a zakázek — leady jsou jen lokálně.</div>';
    } else {
      html+=`<div class="v7-empty ${stampCls}">Nic nečeká. Pošta naposledy obnovena ${esc(meta.posta_stamp||meta.stamp||'—')}.</div>`;
    }
    v.innerHTML=html;
    $$('#v7View [data-lf]').forEach(b=>{b.onclick=()=>{try{localStorage.setItem('v7_leadyFilter',b.dataset.lf);}catch(e){}route();};});
    const pr=$('#postaRefresh'); if(pr)pr.onclick=()=>act('Obnov poštu: spusť analýzu schránky honza@frantisekdron.cz podle skillu/memory fd-posta-analyza a přepiš ~/Desktop/bordel/claude/fd_board_email.json (leady, leady_aktivni, admin_ukoly, podvody, generated). Nic neodesílej.','obnov poštu');
    return;
  }
  if(!rows.length){
    html+='<div class="v7-empty">V tomto filtru nic není.</div>';
  } else {
    const anyKc=rows.some(r=>r.kc>0);
    html+=`<table class="v7-table"><thead><tr><th>KDO / CO</th><th>ODKUD</th><th>ČEKÁ</th>${anyKc?'<th>ZA KOLIK</th>':''}<th>▶</th><th>📋</th></tr></thead><tbody>
      ${rows.map(r=>{
        const isNew=r.dni!=null&&r.dni<=3;
        const bezAdresy=/bez adresy/i.test((r.detail&&r.detail.poznamka)||'');
        return `<tr data-id="${esc(r.id)}">
          <td data-l="KDO / CO"><b>${esc(r.kdo||'')}</b>${isNew?'<span class="v7-badge-new">NOVÝ</span>':''}${bezAdresy?`<span class="v7-warnicon" title="dohledat kontakt">⚠</span>`:''}<br><span class="v7-sub">${esc(r.co||'')}</span></td>
          <td data-l="ODKUD">${esc(r.odkud||'')}</td>
          <td data-l="ČEKÁ"><span class="v7-wait ${r.dni>10?'w10':r.dni>5?'w5':''}">${r.dni??'—'} d</span></td>
          ${anyKc?`<td data-l="ZA KOLIK">${r.kc?fmtKc(r.kc):''}</td>`:''}
          <td data-l="▶">${btnRun(r.prompt,r.label)}</td>
          <td data-l="📋">${btnCopy(r.kopie)}</td>
        </tr>`;
      }).join('')}
    </tbody></table>`;
  }
  v.innerHTML=html;
  bindBtns('#v7View');
  $$('#v7View [data-lf]').forEach(b=>{b.onclick=()=>{try{localStorage.setItem('v7_leadyFilter',b.dataset.lf);}catch(e){}route();};});
  const pr=$('#postaRefresh'); if(pr)pr.onclick=()=>act('Obnov poštu: spusť analýzu schránky honza@frantisekdron.cz podle skillu/memory fd-posta-analyza a přepiš ~/Desktop/bordel/claude/fd_board_email.json (leady, leady_aktivni, admin_ukoly, podvody, generated). Nic neodesílej.','obnov poštu');
  $$('#v7View tbody tr[data-id]').forEach(tr=>{
    tr.onclick=(e)=>{if(e.target.closest('button'))return;const r=rows.find(x=>x.id===tr.dataset.id);if(r)leadDrawer(r);};
  });
}
function findJobByLabel(label){
  if(!label)return null;
  return (JOBS||[]).filter(j=>j.label===label).sort((a,b)=>(b.started||0)-(a.started||0))[0]||null;
}
function leadJobBlock(r){

function ageDny(ts){ if(!ts) return '—'; const d=Math.floor((Date.now()-ts)/86400000); return d<=0?'dnes':d+' d'; }
function slug(s){
  return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
}
async function labUpsert(entity,item){
  if(!ONLINE){toast('jen s běžícím serverem');return null;}
  try{
    const r=await apiFetch('/api/lab/upsert',{method:'POST',body:JSON.stringify({entity,item,by:'human'})});
    let j={};try{j=await r.json();}catch(e){}
    if(!r.ok||j.ok===false){toast('Uložení selhalo');return null;}
    DB.lab=DB.lab||{};
    const lst=DB.lab[entity]=DB.lab[entity]||[];
    const idx=lst.findIndex(x=>x.id===item.id);
    const merged=j.item||{...(idx>-1?lst[idx]:{}),...item};
    if(idx>-1)lst[idx]=merged; else lst.push(merged);
    return merged;
  }catch(e){toast('Server neodpověděl');return null;}
}

function napady(v){
  const ideas=((DB.lab&&DB.lab.ideas)||[]).filter(i=>!i.deleted);
  if(!ONLINE && !ideas.length){ v.innerHTML='<div class="v7-empty">Nápady jsou jen lokálně.</div>'; return; }
  const inbox=ideas.filter(i=>i.stav==='inbox');
  const anoL=ideas.filter(i=>i.stav==='ano');
  const pozdejiL=ideas.filter(i=>i.stav==='pozdeji');
  const neL=ideas.filter(i=>i.stav==='ne');
  const c=inbox[0];
  let html=`<div class="v7-h"><b>Nápady k roztřídění</b> <span class="v7-sub">${inbox.length} čeká · ano ${anoL.length} · později ${pozdejiL.length} · ne ${neL.length}</span>
    <span class="v7-keys">A = ano · N = ne · P = později · Del = smazat · Enter = 🧠 rozveď · ⌘I = nový</span></div>`;
  const deg=degNames(DB.degraded||[]);
  if(deg.length) html+='<div class="v7-warn">⚠ Poškozený zdroj: '+esc(deg.join(', '))+' — nápady/milníky nejsou prázdné, jen je nejde načíst.</div>';
  if(c){
    html+=`<div class="v7-napad" id="napadCur">${esc(c.t)}<div class="v7-sub" style="margin-top:10px">${esc(c.zdroj||'—')} · ${esc(c.kategorie||'—')} · ${ageDny(c.ts)}</div></div>`;
    if(Array.isArray(c.varianty)&&c.varianty.length){
      html+=`<div class="v7-mono" id="napadVarianty">${c.varianty.map(x=>'– '+esc(x)).join('<br>')}</div>`;
    }
    html+=`<div class="v7-napad-btns">
        <button class="v7-btn yes" data-k="ano">A · ano</button><button class="v7-btn no" data-k="ne">N · ne</button>
        <button class="v7-btn later" data-k="pozdeji">P · později</button><button class="v7-btn ghost" data-k="del">Del · smazat</button>
        <button class="v7-btn ghost" data-k="rozved" title="job: 3 varianty pojetí">🧠 rozveď</button></div>`;
  } else {
    html+='<div class="v7-empty">Schránka je prázdná — ⌘I přidá nový nápad.</div>';
  }
  html+=`<details class="v7-list" open><summary>Ano · ${anoL.length}</summary>${napadyList(anoL,'ano')}</details>
    <details class="v7-list"><summary>Později · ${pozdejiL.length}</summary>${napadyList(pozdejiL,'pozdeji')}</details>
    <details class="v7-list"><summary>Ne · ${neL.length}</summary>${napadyList(neL,'ne')}</details>`;
  v.innerHTML=html;
  if(c){
    $$('#v7View .v7-napad-btns [data-k]').forEach(b=>{
      b.onclick=()=>{
        const k=b.dataset.k;
        if(k==='ano'||k==='ne'||k==='pozdeji') ideaStav(c.id,k);
        else if(k==='del') ideaDel(c.id);
        else if(k==='rozved') ideaRozved(c);
      };
    });
  }
  $$('#v7View [data-iid]').forEach(b=>{
    b.onclick=()=>{
      const id=b.dataset.iid, act_=b.dataset.act;
      const it=ideas.find(x=>x.id===id);
      if(!it)return;
      if(act_==='ms') ideaToMilestone(it);
      else if(act_==='ex') ideaToExperiment(it);
      else if(act_==='del') ideaDel(id);
      else if(act_==='inbox') ideaStav(id,'inbox');
      else if(act_==='ano'||act_==='ne') ideaStav(id,act_);
    };
  });
}

//////////////////// LAB ////////////////////
const LAB_STAGE_SEQ=['idea','validate','build','test'];
function decisionsSection(){
  const decs=((DB.lab&&DB.lab.decisions)||[]).filter(d=>!d.deleted);
  const today=new Date().toISOString().slice(0,10);
  const revisit=decs.filter(d=>d.status==='active'&&d.revisit_at&&d.revisit_at<=today);
  const rows=decs.map(d=>{
    const red=(d.status==='active'&&d.revisit_at&&d.revisit_at<=today);
    return `<div class="v7-idearow" data-did="${esc(d.id)}">
      <span class="t">${esc(d.chosen||d.context||'')}</span>
      <span class="src">${d.revisit_at?`<span class="${red?'v7-wait w10':''}">${esc(d.revisit_at)}</span>`:'—'} · ${d.reversible?'vratné':'nevratné'}</span>
      <span class="btns"><button class="v7-btn ghost" data-act="plati">✓ platí dál (+90 d)</button><button class="v7-btn ghost" data-act="zmenil">↺ změnil jsem názor</button></span></div>`;
  }).join('') || '<div class="v7-sub" style="padding:8px 0">žádná rozhodnutí</div>';
  return {html:rows, n:decs.length, k:revisit.length};
}
function experimentsSection(){
  const exps=((DB.lab&&DB.lab.experiments)||[]).filter(e=>!e.deleted);
  const bez=exps.filter(e=>e.needs_definition||!e.metric);
  const rows=exps.map(e=>{
    const metricTxt=e.metric?esc(e.metric):'<span class="v7-wait w10">chybí metrika</span>';
    return `<div class="v7-idearow" data-eid="${esc(e.id)}">
      <span class="t">${esc(e.title||'')} <span class="v7-sub">${esc(e.stage||'')}</span></span>
      <span class="src">${metricTxt} · ${esc(e.review_date||'—')}</span>
      <span class="btns"><button class="v7-btn ghost" data-act="metrika">✎ metrika</button><button class="v7-btn ghost" data-act="stage">stage ▸</button><button class="v7-btn ghost" data-act="keep">KEEP</button><button class="v7-btn ghost" data-act="kill">KILL</button></span></div>`;
  }).join('') || '<div class="v7-sub" style="padding:8px 0">žádné experimenty</div>';
  return {html:rows, n:exps.length, bez:bez.length};
}
function bindDecisionButtons(){
  $$('#v7View [data-did]').forEach(row=>{
    const id=row.dataset.did;
    const d=((DB.lab&&DB.lab.decisions)||[]).find(x=>x.id===id);
    if(!d)return;
    row.querySelectorAll('button').forEach(b=>{
      if(b.dataset.act==='plati') b.onclick=async()=>{
        const nd=new Date(Date.now()+90*86400000).toISOString().slice(0,10);
        const it=await labUpsert('decisions',{id,revisit_at:nd}); if(it)afterLabWrite(null);
      };
      else if(b.dataset.act==='zmenil') b.onclick=async()=>{
        const proc=prompt('Proč?'); if(proc==null)return;
        const nove=prompt('Nové rozhodnutí:'); if(!nove)return;
        const now=new Date().toISOString().slice(0,10);
        const old=await labUpsert('decisions',{id,status:'changed',why_changed:proc,changed_at:now});
        if(!old)return;
        const newId='dec-'+Date.now().toString(36);
        await labUpsert('decisions',{id:newId,milestone_id:d.milestone_id,context:d.context,options:d.options||[],
          chosen:nove,rationale:proc,reversible:d.reversible,revisit_at:d.revisit_at,status:'active',
          evidence_status:'conversation_synthesis',created:now,supersedes:id});
        afterLabWrite(null);
      };
    });
  });
}
function bindExperimentButtons(){
  $$('#v7View [data-eid]').forEach(row=>{
    const id=row.dataset.eid;
    const e=((DB.lab&&DB.lab.experiments)||[]).find(x=>x.id===id);
    if(!e)return;
    row.querySelectorAll('button').forEach(b=>{
      const act_=b.dataset.act;
      if(act_==='metrika') b.onclick=async()=>{
        const met=prompt('Metrika:', e.metric||''); if(met==null)return;
        const thr=prompt('Práh (threshold):', e.threshold||'')||'';
        const it=await labUpsert('experiments',{id,metric:met,threshold:thr,needs_definition:false}); if(it)afterLabWrite(null);
      };
      else if(act_==='stage') b.onclick=async()=>{
        const i2=LAB_STAGE_SEQ.indexOf(e.stage); const next=LAB_STAGE_SEQ[Math.min(LAB_STAGE_SEQ.length-1,(i2<0?0:i2)+1)];
        const it=await labUpsert('experiments',{id,stage:next}); if(it)afterLabWrite(null);
      };
      else if(act_==='keep') b.onclick=async()=>{const it=await labUpsert('experiments',{id,verdict:'keep'}); if(it)afterLabWrite(null);};
      else if(act_==='kill') b.onclick=async()=>{const it=await labUpsert('experiments',{id,verdict:'kill'}); if(it)afterLabWrite(null);};
    });
  });
}
function labFooter(){
  const el=$('#labFootLine'); if(!el)return;
  const msTotal=((DB.lab&&DB.lab.milestones)||[]).filter(m=>!m.deleted).length;
  const inboxN=((DB.lab&&DB.lab.ideas)||[]).filter(i=>!i.deleted&&i.stav==='inbox').length;
  const base=msTotal+' milníků · '+inboxN+' nápadů ve schránce · ručních zápisů za 30 dní: ';
  if(!ONLINE){ el.textContent=base+'—'; return; }
  el.textContent=base+'…';
  apiFetch('/api/lab/stats').then(r=>r.json()).then(s=>{
    const cur2=$('#labFootLine'); if(!cur2)return;
    cur2.textContent=base+((s&&s.human_writes_30d!=null)?s.human_writes_30d:'—');
  }).catch(()=>{ const cur2=$('#labFootLine'); if(cur2)cur2.textContent=base+'—'; });
}
function msReopenFresh(id){
  const fresh=((DB.lab&&DB.lab.milestones)||[]).find(x=>x.id===id);
  if(fresh) msDrawer(fresh);
}
function msDrawer(m){
  drawerKind='ms';
  const L=DB.lab||{};
  const relFrom=(L.relations||[]).filter(r=>r.from===m.id && !r.deleted);
  const relTo=(L.relations||[]).filter(r=>r.to===m.id && !r.deleted);
  let relHtml=relFrom.map(r=>{
    const tgt=(L.milestones||[]).find(x=>x.id===r.to);
    return `<div class="v7-drow v7-click" data-relid="${esc(r.to)}"><span>→ ${esc(r.type)}</span><b>${esc(tgt?tgt.title:r.to)}</b></div>`;
  }).join('') + relTo.map(r=>{
    const src=(L.milestones||[]).find(x=>x.id===r.from);
    return `<div class="v7-drow v7-click" data-relid="${esc(r.from)}"><span>← ${esc(r.type)}</span><b>${esc(src?src.title:r.from)}</b></div>`;
  }).join('');
  if(!relHtml) relHtml='<div class="v7-sub">žádné</div>';
  const decs=(L.decisions||[]).filter(d=>d.milestone_id===m.id && !d.deleted);
  const decHtml=decs.length?decs.map(d=>`<div class="v7-drow"><span>${esc(d.chosen||d.context||'')}</span><b>${esc(d.status||'')}</b></div>`).join(''):'<div class="v7-sub">žádná</div>';
  const exps=(L.experiments||[]).filter(e=>e.milestone_id===m.id && !e.deleted);
  const expHtml=exps.length?exps.map(e=>`<div class="v7-drow"><span>${esc(e.title||'')}</span><b>${esc(e.stage||'')}</b></div>`).join(''):'<div class="v7-sub">žádné</div>';
  const hist=(m.history||[]).slice(-6).reverse();
  const histHtml=hist.length?hist.map(h=>`<div class="v7-drow"><span>${esc(h.date||'')}</span><b>${esc(h.what||'')}</b></div>`).join(''):'<div class="v7-sub">bez historie</div>';
  const html=`
    ${m.why?`<p>${esc(m.why)}</p>`:''}
    ${m.summary?`<p>${esc(m.summary)}</p>`:''}
    <h3 class="v7-h3">Další krok</h3>
    <div class="v7-drow"><span>krok</span><b>${esc(m.next_action||'—')}</b></div>
    <div class="v7-drow"><span>termín</span><b>${esc(m.next_due||'—')}</b></div>
    <div class="v7-actions"><button class="v7-btn ghost" data-act="termin">📅 termín</button></div>
    <h3 class="v7-h3">Vazby</h3>${relHtml}
    <h3 class="v7-h3">Rozhodnutí</h3>${decHtml}
    <h3 class="v7-h3">Experimenty</h3>${expHtml}
    <h3 class="v7-h3">Historie</h3>${histHtml}
    <div class="v7-actions">
      ${ONLINE?'<button class="v7-btn run" data-act="rozprac">▶ Rozpracuj</button>':''}
      <button class="v7-btn ghost" data-act="keep">KEEP</button>
      <button class="v7-btn ghost" data-act="kill">KILL</button>
      <button class="v7-btn ghost" data-act="krok">✎ další krok</button>
      <button class="v7-btn ghost" data-act="nexp">➕ experiment</button>
      <button class="v7-btn ghost" data-act="ndec">➕ rozhodnutí</button>
    </div>`;
  drawer('MILNÍK · '+(m.status||'').toUpperCase(), m.title||m.id, '--me', html);
  const dc=$('#v7DrawerC');
  dc.querySelectorAll('[data-relid]').forEach(el=>el.onclick=()=>{
    const tgt=(L.milestones||[]).find(x=>x.id===el.dataset.relid);
    if(tgt)msDrawer(tgt);
  });
  const bt=dc.querySelector('[data-act="termin"]'); if(bt)bt.onclick=async()=>{
    const d=prompt('Do kdy (YYYY-MM-DD):', m.next_due||''); if(!d)return;
    const it=await labUpsert('milestones',{id:m.id,next_due:d,due_zdroj:'rucne'});
    if(it){badges();route();msReopenFresh(m.id);}
  };
  const br=dc.querySelector('[data-act="rozprac"]'); if(br)br.onclick=()=>{
    act(`Milník „${m.title}": ${m.why||''}. Další krok: ${m.next_action||''}. Rozpracuj ho a výsledek zapiš přes POST /api/lab/upsert (entity milestones, id ${m.id}).`,
        'rozpracuj: '+(m.title||'').slice(0,24));
  };
  const bk=dc.querySelector('[data-act="keep"]'); if(bk)bk.onclick=async()=>{const it=await labUpsert('milestones',{id:m.id,status:'keep'}); if(it){badges();route();msReopenFresh(m.id);}};
  const bki=dc.querySelector('[data-act="kill"]'); if(bki)bki.onclick=async()=>{const it=await labUpsert('milestones',{id:m.id,status:'kill'}); if(it){badges();route();msReopenFresh(m.id);}};
  const bkr=dc.querySelector('[data-act="krok"]'); if(bkr)bkr.onclick=async()=>{
    const na=prompt('Další krok:', m.next_action||''); if(na==null)return;
    const it=await labUpsert('milestones',{id:m.id,next_action:na}); if(it){badges();route();msReopenFresh(m.id);}
  };
  const bne=dc.querySelector('[data-act="nexp"]'); if(bne)bne.onclick=async()=>{
    const t=prompt('Název experimentu:', m.title||''); if(!t)return;
    const eid='exp-'+slug(t);
    const rd=new Date(Date.now()+30*86400000).toISOString().slice(0,10);
    const it=await labUpsert('experiments',{id:eid,title:t.slice(0,80),hypothesis:t,baseline:'',metric:'',
      threshold:'',budget_czk:null,stage:'idea',verdict:null,review_date:rd,result:'',needs_definition:true,
      milestone_id:m.id});
    if(it){badges();route();msReopenFresh(m.id);}
  };
  const bnd=dc.querySelector('[data-act="ndec"]'); if(bnd)bnd.onclick=async()=>{
    const co=prompt('Co se rozhodlo?'); if(!co)return;
    const proc=prompt('Proč?')||'';
    const vrat=(prompt('Vratné? (a/n)','a')||'a').toLowerCase().startsWith('a');
    const rev=prompt('Revidovat do (YYYY-MM-DD):')||null;
    const id='dec-'+Date.now().toString(36);
    const it=await labUpsert('decisions',{id,milestone_id:m.id,context:co,options:[],chosen:co,rationale:proc,
      reversible:vrat,revisit_at:rev,status:'active',evidence_status:'conversation_synthesis',
      created:new Date().toISOString().slice(0,10)});
    if(it){badges();route();msReopenFresh(m.id);}
  };
}
function lab(v){
  if(labView==='mapa'){ mapa(v); return; }
  const L=DB.lab||{};
  const milestones=(L.milestones||[]).filter(m=>!m.deleted);
  const ideasAny=(L.ideas||[]).length>0;
  const mapaMa=((DB.mapa&&DB.mapa.nodes)||[]).length>0;
  if(!ONLINE && !milestones.length && !ideasAny){
    if(mapaMa){
      v.innerHTML='<div class="v7-h"><b>Lab</b> <span class="v7-sub">milníky · rozhodnutí · experimenty</span></div><div class="v7-empty">Lab je jen lokálně. <button class="v7-btn ghost" id="labMapa">🗺 Mapa</button></div>';
      const lm=$('#labMapa'); if(lm)lm.onclick=()=>{labView='mapa';route();};
    } else {
      v.innerHTML='<div class="v7-h"><b>Lab</b> <span class="v7-sub">milníky · rozhodnutí · experimenty</span></div><div class="v7-empty">Lab je jen lokálně.</div>';
    }
    return;
  }
  let showAll=false;
  try{showAll=localStorage.getItem('v7_labAll')==='1';}catch(e){}
  const today=new Date().toISOString().slice(0,10);
  const filtered=(showAll?milestones:milestones.filter(m=>['build','test'].includes(m.status)||(m.next_due&&m.next_due<=today))).slice();
  const rank=m=>{ if(m.next_due&&m.next_due<today)return 0; if(!m.next_due)return 1; return 2; };
  filtered.sort((a,b)=>rank(a)-rank(b)||((b.priority||0)-(a.priority||0)));

  let html=`<div class="v7-h"><b>Lab</b> <span class="v7-sub">milníky · rozhodnutí · experimenty</span>
    <button class="v7-btn ghost" id="labMapa">🗺 Mapa</button>
    <label class="v7-chk"><input type="checkbox" id="labAll" ${showAll?'checked':''}> ukázat vše (i keep/kill)</label></div>`;
  const deg=degNames(DB.degraded||[]);
  if(deg.length) html+='<div class="v7-warn">⚠ Poškozený zdroj: '+esc(deg.join(', '))+' — nápady/milníky nejsou prázdné, jen je nejde načíst.</div>';

  if(!filtered.length){
    html+='<div class="v7-empty">Nic k řešení — zkus „ukázat vše".</div>';
  } else {
    const evMap={conversation_synthesis:['dohad',''],email_verified:['e-mail','--se'],web_verified:['web','--da'],official_verified:['úřední','--pr']};
    html+='<table class="v7-table"><thead><tr><th>MILNÍK</th><th>FÁZE</th><th>STAV</th><th>PRIORITA</th><th>DALŠÍ KROK</th><th>DO KDY</th><th>DŮVĚRA</th></tr></thead><tbody>';
    filtered.forEach(m=>{
      const dueBad=(m.status==='build'&&!m.next_due);
      const dueRed=(m.next_due&&m.next_due<today);
      const ev=evMap[m.evidence_status]||['—',''];
      html+=`<tr data-mid="${esc(m.id)}">
        <td data-l="MILNÍK"><b>${esc(m.title||m.id)}</b></td>
        <td data-l="FÁZE">${esc(m.phase||'—')}</td>
        <td data-l="STAV">${ONLINE?`<select class="v7-sel" data-mid2="${esc(m.id)}">${['idea','build','test','keep','kill'].map(s=>`<option value="${s}" ${m.status===s?'selected':''}>${s}</option>`).join('')}</select>`:esc(m.status||'—')}</td>
        <td data-l="PRIORITA">${m.priority??'—'}</td>
        <td data-l="DALŠÍ KROK">${esc(m.next_action||'—')}</td>
        <td data-l="DO KDY">${dueBad?'<span class="v7-wait w10">chybí termín</span>':(m.next_due?`<span class="${dueRed?'v7-wait w10':''}">${esc(m.next_due)}</span>`:'—')}</td>
        <td data-l="DŮVĚRA"><span class="v7-dot" style="background:var(${ev[1]||'--dim'})"></span>${ev[0]}</td>
      </tr>`;
    });
    html+='</tbody></table>';
  }

  const dec=decisionsSection();
  const exp=experimentsSection();
  html+=`<details class="v7-list"><summary>Rozhodnutí (${dec.n}) — ${dec.k} k revizi</summary>${dec.html}</details>
    <details class="v7-list"><summary>Experimenty (${exp.n}) — ${exp.bez} bez metriky</summary>${exp.html}</details>
    <div class="v7-sub" id="labFootLine" style="margin-top:12px">…</div>`;

  v.innerHTML=html;
  const lm=$('#labMapa'); if(lm)lm.onclick=()=>{labView='mapa';route();};
  const la=$('#labAll'); if(la)la.onchange=()=>{try{localStorage.setItem('v7_labAll', la.checked?'1':'0');}catch(e){} route();};
  $$('#v7View select[data-mid2]').forEach(s=>{s.onclick=e=>e.stopPropagation(); s.onchange=async()=>{const it=await labUpsert('milestones',{id:s.dataset.mid2,status:s.value}); if(it)afterLabWrite(null);};});
  $$('#v7View tbody tr[data-mid]').forEach(tr=>{
    tr.onclick=(e)=>{if(e.target.closest('select'))return; const m=milestones.find(x=>x.id===tr.dataset.mid); if(m)msDrawer(m);};
  });
  bindDecisionButtons(); bindExperimentButtons();
  labFooter();
}

//////////////////// MAPA (V5) ////////////////////
const MAPA_TYPE_LABEL={skill:'skill',data:'data',zak:'zakázka',makler:'makléř',mem:'projekt',ms:'milník',idea:'nápad',hlidac:'hlídač'};
const MAPA_TYPE_VAR={skill:'--sk',data:'--da',hlidac:'#ff8a5b',zak:'--se',makler:'#46d17f',mem:'--me',ms:'#ffd166',idea:'--brand'};
const MAPA_COL={hlidac:0,data:0,skill:1,makler:2,zak:2,mem:3,ms:4,idea:4};
const MAPA_REL_TYPES=new Set(['enables','depends_on','refines','supersedes','conflicts_with','evidence_for','propojeni']);
function cssVar(nm){return getComputedStyle(document.documentElement).getPropertyValue(nm).trim();}
function mapaColor(typ){const raw=MAPA_TYPE_VAR[typ]||'--dim2';return raw[0]==='#'?raw:(cssVar(raw)||'#888');}
// rr()/rrTop() — kopie z FD_BOARD_full.html 3340-3341; mapaBez/mapaBezPt — kopie bez()/bezPt() z initPg() ~3042-3048
function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();}
function rrTop(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.lineTo(a+w,b+h);x.lineTo(a,b+h);x.arcTo(a,b,a+w,b,r);x.closePath();}

function searchCmdAdd(q){

function mapaRenderPaths(){

    const steps=(p.steps||[]).map((s,i)=>{

async function mapaPathFinish(){

  const sid=slug(name)||('path-'+Date.now().toString(36)),it=await labUpsert('paths',{id:sid,name,steps});

  if(!ONLINE){drawer('JOB',id,'--pr','<div class="v7-sub">server neběží</div>');return;}
  apiFetch('/api/jobs?id='+encodeURIComponent(id)).then(r=>r.json()).then(j=>{
    drawer('JOB',j.label||id,'--pr',`<pre class="v7-mono">${esc((j.out||[]).join('\n'))}</pre>`);
  }).catch(()=>drawer('JOB',id,'--pr','<div class="v7-sub">nepodařilo se načíst</div>'));
}
function memDrawer(id){
  drawerKind='mem';
  if(!ONLINE){drawer('PAMĚŤ',id,'--sk','<div class="v7-sub">server neběží</div>');return;}
  apiFetch('/api/memory?id='+encodeURIComponent(id)).then(r=>r.json()).then(m=>{
    drawer('PAMĚŤ',m.name||id,'--sk',`<pre class="v7-mono">${esc(m.body||'')}</pre>`);
  }).catch(()=>drawer('PAMĚŤ',id,'--sk','<div class="v7-sub">nepodařilo se načíst</div>'));
}
function skillDrawer(s){drawerKind='skill';drawer('SKILL',s.name,'--sk',`<div class="v7-sub">${esc(s.desc||'')}</div>`);}

//////////////////// ⌘K ////////////////////
function openCmd(){cmdMode='search';$('#v7Cmd').classList.add('on');$('#v7CmdIn').value='';$('#v7CmdIn').placeholder='hledej: leady, zakázky, nápady, milníky, skilly, paměť…';searchCmd('');setTimeout(()=>$('#v7CmdIn').focus(),10);}
function closeCmd(){$('#v7Cmd').classList.remove('on');cmdMode='search';$('#v7CmdIn').placeholder='hledej: leady, zakázky, nápady, milníky, skilly, paměť…';}
function searchCmd(q){
  q=norm(q);cmdSel=0;const items=[];
  ((DB.akce&&DB.akce.rows)||[]).forEach(r=>{if(norm((r.kdo||'')+(r.co||'')).includes(q))items.push({g:'Leady',nm:r.kdo,ds:r.co,act:()=>{closeCmd();go('leady');setTimeout(()=>leadDrawer(r),50);}});});
  (DB.pipeline||[]).forEach(z=>{if(norm((z.nazev||'')+(z.klient||'')).includes(q))items.push({g:'Zakázky',nm:z.nazev,ds:z.klient,act:()=>{closeCmd();go('zakazky');setTimeout(()=>zakDrawer(z),50);}});});
  ((DB.lab&&DB.lab.milestones)||[]).forEach(m=>{if(norm(m.title||'').includes(q))items.push({g:'Milníky',nm:m.title,ds:'',act:()=>{closeCmd();go('lab');}});});
  ((DB.lab&&DB.lab.ideas)||[]).forEach(i=>{if(norm(i.t||'').includes(q))items.push({g:'Nápady',nm:i.t,ds:'',act:()=>{closeCmd();go('napady');}});});
  (DB.skills||[]).forEach(s=>{if(norm(s.name||'').includes(q))items.push({g:'Skilly',nm:s.name,ds:s.desc||'',act:()=>{closeCmd();skillDrawer(s);}});});
  (DB.memory||[]).forEach(m=>{if(norm(m.name||'').includes(q))items.push({g:'Paměť',nm:m.name,ds:m.desc||'',act:()=>{closeCmd();memDrawer(m.id||m.name);}});});
  cmdItems=items.slice(0,12);drawCmd();
}
function drawCmd(){
  let g='',h='';
  cmdItems.forEach((it,i)=>{if(it.g!==g){g=it.g;h+=`<div class="v7-cmdgrp">${esc(g)}</div>`;}
    h+=`<div class="v7-cmdrow ${i===cmdSel?'sel':''}" data-i="${i}"><span class="v7-nm">${esc(it.nm||'')}</span><span class="v7-ds">${esc(it.ds||'')}</span></div>`;});
  $('#v7CmdRes').innerHTML=h||'<div class="v7-sub" style="padding:10px 14px">Nic nenalezeno.</div>';
  $$('#v7CmdRes .v7-cmdrow').forEach(r=>{r.onclick=()=>cmdItems[+r.dataset.i].act();r.onmouseenter=()=>{cmdSel=+r.dataset.i;drawCmd();};});
}

//////////////////// zapojení ////////////////////
function pgRemoteRefresh(){
  const cur=remoteGet();
  const st=$('#pgRemoteState');
  if(st)st.textContent=cur?('uloženo: '+cur.url+' · token •••'):'';
  const u=$('#pgRemoteUrl'); if(u&&cur)u.value=cur.url;
  const t=$('#pgRemoteTok'); if(t)t.value='';
}
pgRemoteRefresh();
(()=>{const c=$('#pgRemoteConn'); if(c)c.onclick=()=>{
  const url=($('#pgRemoteUrl').value||'').trim(), tok=($('#pgRemoteTok').value||'').trim();
  const st=$('#pgRemoteState');
  if(!url||!tok){if(st)st.textContent='Vyplň adresu i token.';return;}
  remoteSet(url,tok); pgRemoteRefresh();
  if(st)st.textContent='Uloženo — připojí se po přihlášení.';
};})();
(()=>{const d=$('#pgRemoteDisc'); if(d)d.onclick=()=>{remoteClear();pgRemoteRefresh();};})();
$$('#v7Tabs button').forEach(b=>b.onclick=()=>go(b.dataset.t));
$('#v7Scrim').onclick=closeDrawer;
$('#v7Search').onclick=openCmd;
$('#v7CmdIn').oninput=e=>{(cmdMode==='pridat'?searchCmdAdd:searchCmd)(e.target.value);};
$('#v7Cmd').onclick=e=>{if(e.target.id==='v7Cmd')closeCmd();};
// swipe doprava zavře drawer (kopie logiky 3556-3559, nové id)
(()=>{let sx=0,sy=0,t=false;const d=$('#v7Drawer');
  d.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;t=true;},{passive:true});
  d.addEventListener('touchend',e=>{if(!t)return;t=false;const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);
    if(dx>80&&dy<60)closeDrawer();},{passive:true});})();
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmd();}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='i'){e.preventDefault();ideaNew();}
  if(e.key==='Escape'){closeCmd();closeDrawer();}
  if($('#v7Cmd').classList.contains('on')){
    if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);drawCmd();}
    if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);drawCmd();}
    if(e.key==='Enter'&&cmdItems[cmdSel]){cmdItems[cmdSel].act();}
  }
  if(cur==='lab'&&labView==='mapa'){
    const tgt=(e.target&&e.target.tagName||'').toLowerCase();
    const busy=tgt==='input'||tgt==='textarea'||$('#v7Cmd').classList.contains('on')||$('#v7Drawer').classList.contains('on');
    if(!busy){
      if(e.key==='f'||e.key==='F'){e.preventDefault();mapaFit();}
      else if(e.key==='Escape'){
        if(mapaPathBuilding){mapaPathBuilding=null;const b=$('#mapaPathNew');if(b)b.textContent='+ cesta';toast('Zrušeno');}
        else{mapaSel=null;mapaSideDefault();}
      }
      else if(e.key==='Enter'&&mapaPathBuilding){e.preventDefault();mapaPathFinish();}
    }
  }
  if(cur==='napady'){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    const tgt=(e.target&&e.target.tagName||'').toLowerCase();
    const busy=tgt==='input'||tgt==='textarea'||$('#v7Cmd').classList.contains('on')||$('#v7Drawer').classList.contains('on');
    if(!busy){
      const inb=((DB.lab&&DB.lab.ideas)||[]).filter(i=>!i.deleted&&i.stav==='inbox');
      const c=inb[0];
      if(c){
        const k=e.key.toLowerCase();
        if(k==='a'){e.preventDefault();ideaStav(c.id,'ano');}
        else if(k==='n'){e.preventDefault();ideaStav(c.id,'ne');}
        else if(k==='p'){e.preventDefault();ideaStav(c.id,'pozdeji');}
        else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();ideaDel(c.id);}
        else if(e.key==='Enter'){e.preventDefault();ideaRozved(c);}
      }
    }
  }
});
if(location.hash.slice(1) in SECTORS)cur=location.hash.slice(1);
$$('#v7Tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
try{if(localStorage.getItem('fdb_theme')==='light')document.documentElement.setAttribute('data-t','light');}catch(e){}
boot();
</script>
</body></html>
