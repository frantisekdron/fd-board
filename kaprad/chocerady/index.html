<style>
/* Layout: celoplošná mapa; nahoře lišta s epochami, dole vysouvací panel (na širokém displeji panel vlevo). */
:root {
  --paper: #EEF2EE; --panel: #FBFCFA; --ink: #18212B; --muted: #5A6862; --line: #D3DBD5;
  --fern: #2C7A4C; --fern-soft: #DCEBDF; --gold: #B8860F; --carmine: #B3263E; --amber: #C9701A; --sun: #C9A21A;
  --sky: #2B6C98; --umber: #85563A; --violet: #6A57A3; --slate: #4B5866; --teal: #1D8582; --rust: #9B4A26;
  --shadow: 0 6px 24px rgba(18, 28, 24, .16);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1418; --panel: #161D22; --ink: #E4EBE6; --muted: #98A6A0; --line: #2A353C;
    --fern: #5DBB83; --fern-soft: #1D3328; --gold: #E1B548; --carmine: #E0566C; --amber: #E8913F; --sun: #E2C04A;
    --sky: #69A8D6; --umber: #C48E6B; --violet: #A895E0; --slate: #9AA8B6; --teal: #4CC2BE; --rust: #D9825A;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1418; --panel: #161D22; --ink: #E4EBE6; --muted: #98A6A0; --line: #2A353C;
  --fern: #5DBB83; --fern-soft: #1D3328; --gold: #E1B548; --carmine: #E0566C; --amber: #E8913F; --sun: #E2C04A;
  --sky: #69A8D6; --umber: #C48E6B; --violet: #A895E0; --slate: #9AA8B6; --teal: #4CC2BE; --rust: #D9825A;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--paper); }
.maplibregl-map { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas-container, .maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas:focus { outline: none; }
.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }

/* horní lišta */
.bar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .02em; margin: 0; line-height: 1; }
.brand .place { font-family: var(--font-display); font-weight: 500; font-size: 19px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .tag { margin-left: auto; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--fern);
  border: 1px solid var(--fern); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.row { display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg button, .chip { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: .02em; color: var(--ink);
  background: transparent; border: 0; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; flex: none; }
.chip[aria-pressed="true"] { background: var(--fern); border-color: var(--fern); color: var(--panel); }
.chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.opacity { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex: none; }
.opacity input { width: 110px; accent-color: var(--fern); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--fern); outline-offset: 2px; }

/* panel */
#sheet { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; height: 44%; background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; box-shadow: var(--shadow); display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .25s ease; }
#sheet.min { height: 112px; }
#sheet.max { height: 78%; }
.handle { display: flex; justify-content: center; padding: 8px 0 2px; cursor: pointer; border: 0; background: transparent; width: 100%; }
.handle span { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.tabs { display: flex; gap: 4px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .02em; background: none; border: 0;
  border-bottom: 3px solid transparent; padding: 6px 10px 7px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--fern); }
.tabs .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.content { flex: 1; overflow-y: auto; padding-block: 10px 18px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) {
  #sheet, #sheet.min, #sheet.max { left: 0; top: var(--bar-h, 120px); bottom: 0; right: auto; width: 400px; height: auto; border-radius: 0; border-top: 0; border-right: 1px solid var(--line); }
  .handle { display: none; }
  .bar { left: 0; }
}

/* položky seznamu */
.list { display: flex; flex-direction: column; gap: 2px; }
.item { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 9px 6px; border-radius: 10px;
  cursor: pointer; border: 0; background: none; text-align: left; color: inherit; width: 100%; font: inherit; }
.item:hover, .item.active { background: var(--fern-soft); }
.score { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1; text-align: center; font-variant-numeric: tabular-nums; }
.score small { display: block; font-family: var(--font-body); font-weight: 600; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.item .t { min-width: 0; }
.item .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.item .t .badge { display: inline-flex; font-size: 11px; padding: 0 6px; margin-right: 4px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  border-radius: 6px; padding: 2px 8px; }
.b-arch { color: var(--amber); border: 1px solid var(--amber); }
.b-ok { color: var(--fern); border: 1px solid var(--fern); }
.b-warn { color: var(--sun); border: 1px solid var(--sun); }
.b-no { color: var(--carmine); border: 1px solid var(--carmine); }
.note { font-size: 13px; color: var(--muted); }
.lead { font-size: 14px; margin: 2px 0 10px; color: var(--muted); }

/* detail */
.detail { display: flex; flex-direction: column; gap: 14px; }
.dhead { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 54px; line-height: .9; font-variant-numeric: tabular-nums; }
.big small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.dhead h2 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; margin: 0 0 4px; text-wrap: balance; }
.back { align-self: flex-start; font-family: var(--font-display); font-weight: 600; font-size: 16px; background: none; border: 0; color: var(--fern); cursor: pointer; padding: 0; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.bars { display: flex; flex-direction: column; gap: 5px; }
.barrow { display: grid; grid-template-columns: 112px 1fr 40px; gap: 8px; align-items: center; font-size: 13px; }
.barrow .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.barrow .fill { height: 100%; border-radius: 4px; }
.barrow .v { font-family: var(--font-mono); font-size: 12px; text-align: right; color: var(--muted); }
.reasons { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none; }
.reasons li { display: grid; grid-template-columns: 38px 1fr; gap: 10px; }
.reasons .pct { font-family: var(--font-mono); font-size: 13px; color: var(--fern); padding-top: 2px; }
.reasons b { font-weight: 600; }
.reasons .src { font-size: 12px; color: var(--muted); }
.reasons q { display: block; font-size: 13px; font-style: italic; color: var(--muted); margin-top: 2px; }
.links { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; border-radius: 12px; border: 1px solid var(--line);
  text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 18px; background: var(--panel); }
.btn.primary { background: var(--fern); border-color: var(--fern); color: var(--panel); }
.legal { border-left: 4px solid var(--amber); padding: 8px 12px; background: color-mix(in srgb, var(--amber) 9%, var(--panel)); border-radius: 0 10px 10px 0; font-size: 14px; }
.legal.ok { border-left-color: var(--fern); background: color-mix(in srgb, var(--fern) 9%, var(--panel)); }
.legal.no { border-left-color: var(--carmine); background: color-mix(in srgb, var(--carmine) 9%, var(--panel)); }
.legal a { color: inherit; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--font-mono); font-size: 12px; }
.mix { display: flex; height: 12px; border-radius: 6px; overflow: hidden; }
.mix span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.prose p { margin: 0 0 10px; max-width: 65ch; }
.prose h3 { margin-top: 14px; }
.steps { margin: 0 0 12px; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
.cpj p { margin: 0; }
.why { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.why .src { font-size: 12px; color: var(--muted); }
.why q { display: block; font-size: 13px; font-style: italic; color: var(--muted); }
.rank { color: var(--fern); }
.stat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 6px 0 12px; }
.stat div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.pinwrap { background: none; border: 0; padding: 0; cursor: pointer; }
.pin { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--fern); border: 2px solid var(--panel);
  box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; }
.pin span { display: block; transform: rotate(45deg); font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--panel); }
.attrib { position: absolute; z-index: 4; right: max(8px, env(safe-area-inset-right, 0px)); font-size: 10px; color: var(--muted); background: color-mix(in srgb, var(--panel) 80%, transparent);
  padding: 2px 6px; border-radius: 6px; max-width: 60%; text-align: right; top: calc(var(--bar-h, 120px) + 6px); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; font-family: var(--font-display); font-size: 20px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }
</style>

</head>

function km(lat1, lon1, lat2, lon2) {

async function load() {
  const names = ["meta", "potential", "opps", "evidence", "zones"];
  const res = await Promise.all(names.map((n) => fetch(`data/${n}.json`).then((r) => r.json())));
  names.forEach((n, i) => (S.data[n] = res[i]));
  S.data.potential.features.forEach((f, i) => { f.id = i; f.properties._c = hexCenter(f); });
  S.data.opps.features.forEach((f, i) => { f.id = i; });
  S.data.evidence.features.forEach((f, i) => { f.id = i; f.properties.group = typeGroup[f.properties.type] || "krajina"; });
  applyFocus();
}

function applyFocus() {
  const w = {};
  for (const [c, d] of Object.entries(CLASSES)) w[c] = S.focus === "all" ? d.value : (c === S.focus ? d.value : d.value * 0.08);
  const feats = S.data.potential.features;
  for (const f of feats) {
    let u = 0;
    for (const [c, v] of Object.entries(f.properties.cls || {})) u += (w[c] || 0) * v;
    f.properties._u = u;
  }
  const sorted = [...feats].sort((a, b) => a.properties._u - b.properties._u);
  sorted.forEach((f, i) => (f.properties._p = Math.round((i / Math.max(1, sorted.length - 1)) * 100)));
  const ow = S.data.opps.features;
  for (const f of ow) {
    let u = 0;
    for (const [c, v] of Object.entries(f.properties.classes || {})) u += (w[c] || 0) * v;
    // „Vše“: podle skóre, při zvoleném zaměření podle užitku pro danou třídu
    f.properties._u = S.focus === "all" ? (f.properties.score || 0) * 100 + u : u * (f.properties.score || 1);
  }
  [...ow].sort((a, b) => b.properties._u - a.properties._u).forEach((f, i) => (f.properties._rank = i + 1));
}

function circle(lon, lat, rkm) {

}

  const wide = innerWidth >= 900;
  map.fitBounds([[m.center.lon - dlon, m.center.lat - dlat], [m.center.lon + dlon, m.center.lat + dlat]],
    { padding: wide ? { top: barH() + 10, bottom: 20, left: 420, right: 20 } : { top: barH() + 10, bottom: innerHeight * 0.44 + 10, left: 10, right: 10 }, duration: 0 });
}

  <h3>Jak na to v 6 krocích</h3>
  <ol class="steps">
    <li><b>Vyber místo</b> v záložce Kde hledat (zelené špendlíky s čísly).</li>
    <li><b>Zjisti majitele</b> tlačítkem Katastr a domluv se s ním (obec, kemp, koupaliště).</li>
    <li><b>Jeď tam</b> přes Mapy.com, Google nebo Waze.</li>
    <li><b>Ztracenou věc</b> vrať majiteli, jinak ji odevzdej na obci.</li>
    <li><b>Něco starého</b> (stará mince, bronz, keramika): nech to v zemi, místo si označ a do druhého dne to ohlas archeologům nebo muzeu.</li>
    <li><b>Munice:</b> nesahej, odejdi, volej 158.</li>
  </ol>
  ${m.guide ? `<p><a class="btn primary" href="${esc(m.guide)}" target="_blank" rel="noopener">Návod na 1 stránku (PDF)</a></p>` : ""}
  <h3>Barvy v mapě</h3>
  <div class="legend"><span><i style="background:var(--fern)"></i>Zelené číslo = kde hledat</span><span><i style="background:var(--carmine);opacity:.6"></i>Zákaz (hřbitov, památka, rezervace)</span>
  <span><i style="background:var(--gold);opacity:.5"></i>Historie, jen s archeology</span><span><i style="background:var(--sun);opacity:.5"></i>Pozor (munice, šachty, příroda)</span></div>
  <div class="stat"><div><b>${(st.evidence || 0).toLocaleString("cs")}</b><span>stop v okruhu</span></div><div><b>${(st.cells || 0).toLocaleString("cs")}</b><span>buněk po 1,5 ha</span></div>
  <div><b>${st.zones || 0}</b><span>právních zón</span></div><div><b>${st.need_agreement || 0}</b><span>míst odemkne dohoda s archeology</span></div></div>
  <p>Pilotní výpočet enginu Kapraď nad skutečnými daty z ${esc(m.date || "")}. Skóre je percentil uvnitř tohoto okruhu, ne celé ČR. Váhy jsou zatím expertní odhady; učit se začnou z prvních vycházek.</p>
  <h3>Proč historie jen orientačně</h3>
  <p>Cílené hledání historických předmětů detektorem je v ČR archeologický výzkum. Bez oprávnění hrozí pokuta až 2 mil. Kč a nálezy patří kraji. Legální cesta vede přes spolupráci s archeology (AMČR-PAS); v území dohody Kapraď ukáže přesná místa, navigaci a záznam nálezů.</p>
  <p><a class="btn" href="https://amcr-info.aiscr.cz/amcr-pas/" target="_blank" rel="noopener">Jak se zapojit do AMČR-PAS</a></p>
  <h3>Zdroje v tomto běhu</h3><dl class="kv">${src}</dl>
  <h3>Známá zjednodušení</h3><p>${(m.caveats || []).map(esc).join(" ")}</p></div>`;
}

// ---------------------------------------------------------------- detail
function showDetail(html, onBack) {
  S.selected = true;
  const c = $("content");
  c.innerHTML = `<div class="detail"><button class="back" id="back">← Zpět na seznam</button>${html}</div>`;
  c.scrollTop = 0;
  $("back").addEventListener("click", () => { S.selected = null; selectHex(null); render(); });
  if (innerWidth < 900 && $("sheet").classList.contains("min")) $("sheet").classList.remove("min");
}
function bars(cls) {
  const tot = Object.entries(cls || {}).filter(([c]) => CLASSES[c]).reduce((a, [, v]) => a + v, 0) || 1;
  return `<div class="bars">${Object.entries(CLASSES).map(([c, d]) => {
    const v = (cls?.[c] || 0) / tot;
    if (v < 0.01) return "";
    return `<div class="barrow"><span>${d.label}</span><div class="track"><div class="fill" style="width:${Math.round(v * 100)}%;background:var(${d.color})"></div></div><span class="v">${Math.round(v * 100)} %</span></div>`;
  }).join("")}</div>`;
}
function reasonsHtml(rs) {
  if (!rs?.length) return `<p class="note">Bez výrazných stop – skóre tvoří hlavně poloha v krajině.</p>`;
  return `<ul class="reasons">${rs.map((r) => `<li><span class="pct">${Math.round(r.share * 100)} %</span><div><b>${esc(r.label)}</b>${r.name ? `: ${esc(r.name)}` : ""}
    <div class="src">${esc(sourceName(r.source))}${r.url ? ` · <a href="${esc(r.url)}" target="_blank" rel="noopener">zdroj</a>` : ""}</div>${r.quote ? `<q>${esc(r.quote)}</q>` : ""}</div></li>`).join("")}</ul>`;
}
function sourceName(s) {
  return { osm: "OpenStreetMap", wikidata: "Wikidata", wikipedia: "Wikipedie", kramerius: "Digitální knihovna (Kramerius)", zabaged: "ZABAGED (ČÚZK)", geonames: "Geografická jména (ČÚZK)", cgs: "Česká geologická služba", dem: "Reliéf DMR 5G", roads_proxy: "Silnice mezi vsemi (odhad staré cesty)" }[s] || s;
}
function openHex(id) {
  const f = S.data.potential.features[id];
  if (!f) return;
  const p = f.properties;
  selectHex(id);
  map.easeTo({ center: p._c, zoom: Math.max(map.getZoom(), 13), duration: 500, padding: innerWidth >= 900 ? { left: 400 } : { bottom: innerHeight * 0.44 } });
  showDetail(`<div class="dhead"><div class="big">${p._p}<small>ze 100</small></div><div><h2>Historické místo</h2>
    <span class="badge b-arch">Jen s archeology</span> <span class="note">jistota ${confLabel(p.conf)} ${confDots(p.conf)}</span></div></div>
    <div class="legal no"><b>Bez archeologů tu nekopej.</b> Hledání historických předmětů bez oprávnění je v ČR přestupek (pokuta až 2 mil. Kč) a nálezy patří kraji.</div>
    <section class="cpj"><h3>Co se tu skrývá</h3><p>${whatLong(p.cls, true)}</p></section>
    <section class="cpj"><h3>Proč zrovna tady</h3>${whyList(p.reasons)}</section>
    <section class="cpj"><h3>Jak na to</h3><p>Legálně jen ve spolupráci s archeology: školení AMČR-PAS, dohoda s muzeem nebo archeologickým ústavem a souhlas majitele. Pak tu aplikace ukáže přesná místa a navigaci.</p></section>
    <section><h3>Co čekat u mincí</h3><div class="mix">${COIN_MIX.map(([l, v, c]) => `<span title="${l}" style="width:${v * 100}%;background:var(${c})"></span>`).join("")}</div>
    <p class="note">Typicky asi 58 % krejcary a haléře 1760–1918, 15 % raný novověk, 10 % groše 1300–1526, zlato pod 0,5 %.</p></section>
    <div class="legal">Šestiúhelník má asi 0,7 km². Přesné místo, navigaci a záznam nálezů Kapraď ukáže jen v území dohody s archeology (AMČR-PAS). <a href="https://amcr-info.aiscr.cz/amcr-pas/" target="_blank" rel="noopener">Jak na to</a></div>`);
}
function selectHex(id) {
  if (S.selHex != null) map.setFeatureState({ source: "potential", id: S.selHex }, { sel: false });
  S.selHex = id;
  if (id != null) map.setFeatureState({ source: "potential", id }, { sel: true });
}
function openOpp(id) {
  const f = S.data.opps.features[id];
  if (!f) return;
  const p = f.properties, L = p.links || {};
  map.easeTo({ center: [p.lon, p.lat], zoom: Math.max(map.getZoom(), 15), duration: 500, padding: innerWidth >= 900 ? { left: 400 } : { bottom: innerHeight * 0.44 } });
  const main = (p.reasons || []).find((r) => MODERN.has(r.type));
  showDetail(`<div class="dhead"><div class="big rank">${p._rank}<small>místo</small></div><div><h2>${esc(p.headline || "Místo")}</h2>
    <span class="badge ${LEGAL[p.legal]?.cls}">${LEGAL[p.legal]?.label}</span> <span class="note">jistota ${confLabel(p.conf)} ${confDots(p.conf)}</span></div></div>
    <div class="links"><a class="btn primary" href="${esc(L.mapy)}" target="_blank" rel="noopener">Navigovat (Mapy.com)</a><a class="btn" href="${esc(L.google)}" target="_blank" rel="noopener">Google</a>
    <a class="btn" href="${esc(L.waze)}" target="_blank" rel="noopener">Waze</a><a class="btn" href="${esc(L.katastr)}" target="_blank" rel="noopener">Komu to patří</a></div>
    <section class="cpj"><h3>Co tu najdeš</h3><p>${whatLong(p.classes)}</p></section>
    <section class="cpj"><h3>Proč zrovna tady</h3>${whyList(p.reasons)}</section>
    <section class="cpj"><h3>Jak na to</h3><ol class="steps">
      <li><b>Domluv se s majitelem</b> (tlačítko Komu to patří). Bez souhlasu nehledej.</li>
      <li>${esc(HOW[main?.type] || "Projdi okolí špendlíku v okruhu asi 50 m.")}</li>
      <li>${esc(TIP)}</li>
      <li>Ztracenou věc vrať majiteli, jinak ji odevzdej na obci. <b>Něco starého</b> nech v zemi a do druhého dne to ohlas archeologům nebo muzeu.</li>
    </ol></section>
    ${(p.zones || []).length ? `<div class="legal"><b>Pozor, v místě je zóna:</b><br>${p.zones.map(esc).join("<br>")}</div>` : ""}
    <dl class="kv"><dt>Poloha</dt><dd>${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</dd><dt>Pozemek</dt><dd>${esc(landLabel(p.landcover))}</dd><dt>Skóre</dt><dd>${p.score} ze 100</dd></dl>`);
}
function landLabel(l) { return { arable: "orná půda", grassland: "louka/pastvina", forest: "les", garden: "zahrada/sad", built: "zástavba", water: "voda", other: "jiné" }[l] || l; }
function openEvidence(f) {
  const p = f.properties;
  showDetail(`<div><h2 style="font-family:var(--font-display);margin:0">${esc(p.label)}</h2><p class="note">${esc(p.name || "")}</p></div>
    <dl class="kv"><dt>Zdroj</dt><dd>${esc(sourceName(p.source))}</dd><dt>Nejistota polohy</dt><dd>± ${p.sigma_m} m</dd><dt>Důvěra</dt><dd>${Math.round(p.conf * 100)} %</dd></dl>
    ${p.quote ? `<q class="note" style="display:block;font-style:italic">${esc(p.quote)}</q>` : ""}${p.url ? `<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Otevřít zdroj</a>` : ""}`);
}
function openZone(p) {
  const L = LEGAL[p.level] || {};
  showDetail(`<div><span class="badge ${L.cls}">${L.label}</span><h2 style="font-family:var(--font-display);margin:6px 0 0">${esc(p.name || "Zóna")}</h2></div>
    <div class="legal ${p.level === "forbidden" ? "no" : ""}">${esc(p.basis || "")}</div>`);
}

$("handle").addEventListener("click", () => {
  const s = $("sheet");
  if (s.classList.contains("min")) s.classList.remove("min");
  else if (s.classList.contains("max")) { s.classList.remove("max"); s.classList.add("min"); }
  else s.classList.add("max");
});

load().then(() => {
  const m = S.data.meta;
  $("place").textContent = `${m.place || ""} · ${m.radius_km} km`;
  document.title = `Kapraď ${m.place || ""}`.trim();
  buildBar(); setBarH(); render(); initMap();
}).catch((e) => {
  $("loading").textContent = "Data se nepodařilo načíst. Zkus stránku obnovit.";
  console.error(e);
});
</script>
</body>
</html>
