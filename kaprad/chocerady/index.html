<title>Kapraď</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Kapraď – mapa pro kopáče. Šest věcí: co hledám · mapa · místa · potenciál · proč tady · navigace. */
:root {
  --paper: #EEF2EE; --panel: #FBFCFA; --ink: #18212B; --muted: #5A6862; --line: #D3DBD5;
  --fern: #2C7A4C; --fern-soft: #DCEBDF; --gold: #B8860F; --carmine: #B3263E; --amber: #C9701A; --sun: #C9A21A; --me: #1A73E8;
  --shadow: 0 6px 24px rgba(18, 28, 24, .16);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1418; --panel: #161D22; --ink: #E4EBE6; --muted: #98A6A0; --line: #2A353C;
    --fern: #5DBB83; --fern-soft: #1D3328; --gold: #E1B548; --carmine: #E0566C; --amber: #E8913F; --sun: #E2C04A; --me: #5EA1FF;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F1418; --panel: #161D22; --ink: #E4EBE6; --muted: #98A6A0; --line: #2A353C;
  --fern: #5DBB83; --fern-soft: #1D3328; --gold: #E1B548; --carmine: #E0566C; --amber: #E8913F; --sun: #E2C04A; --me: #5EA1FF;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
#app { position: relative; height: 100%; }
#map { position: absolute; inset: 0; background: var(--paper); }
.maplibregl-map { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
.maplibregl-canvas-container, .maplibregl-canvas { position: absolute; left: 0; top: 0; }
.maplibregl-canvas:focus { outline: none; }
.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--fern); outline-offset: 2px; }

/* lišta: název · co hledám · mapa */
.bar { position: absolute; top: 0; left: 0; right: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow);
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 7px; }
.top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 23px; margin: 0; line-height: 1; }
.top a.place { font-family: var(--font-display); font-weight: 600; font-size: 18px; color: var(--muted); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.top .sp { flex: 1; }
.round { flex: none; height: 32px; min-width: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
  font-family: var(--font-display); font-weight: 700; font-size: 16px; cursor: pointer; }
.round[aria-pressed="true"] { background: var(--me); border-color: var(--me); color: #fff; }
.row { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.row::-webkit-scrollbar { display: none; }
.row .lbl { flex: none; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 58px; }
.chip { flex: none; font-family: var(--font-display); font-weight: 600; font-size: 16px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px;
  background: transparent; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.row.what .chip[aria-pressed="true"] { background: var(--fern); border-color: var(--fern); }
.row input[type=range] { flex: none; width: 90px; accent-color: var(--fern); }

/* panel se seznamem a kartou */
#sheet { position: absolute; z-index: 6; left: 0; right: 0; bottom: 0; height: 46%; background: var(--panel); border-top: 1px solid var(--line);
  border-radius: 16px 16px 0 0; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); transition: height .25s ease; }
#sheet.min { height: 104px; }
#sheet.max { height: 80%; }
.handle { display: flex; justify-content: center; padding: 8px 0 4px; cursor: pointer; border: 0; background: transparent; width: 100%; }
.handle span { width: 44px; height: 5px; border-radius: 3px; background: var(--line); }
.mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 2px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); }
.mode button { font-family: var(--font-display); font-weight: 700; font-size: 17px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: transparent; cursor: pointer; }
.mode button[aria-pressed="true"].ok { background: var(--fern); border-color: var(--fern); color: var(--panel); }
.mode button[aria-pressed="true"].hist { background: var(--amber); border-color: var(--amber); color: var(--panel); }
.mode small { font-family: var(--font-body); font-weight: 600; font-size: 12px; opacity: .85; margin-left: 6px; }
.content { flex: 1; overflow-y: auto; padding-block: 2px 18px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
@media (min-width: 900px) {
  #sheet, #sheet.min, #sheet.max { left: 0; top: var(--bar-h, 120px); bottom: 0; right: auto; width: 400px; height: auto; border-radius: 0; border-top: 0; border-right: 1px solid var(--line); }
  .handle { display: none; }
}
.note { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.sortrow { display: flex; gap: 6px; margin: 0 0 6px; }
.sortrow .chip { font-size: 14px; padding: 2px 10px; }

/* řádek místa */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding: 9px 4px; border: 0; border-bottom: 1px solid var(--line);
  background: none; text-align: left; cursor: pointer; width: 100%; }
.item:hover { background: var(--fern-soft); }
.num { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-align: center; color: var(--fern); line-height: 1; }
.num.h { color: var(--amber); font-size: 18px; }
.num.yr { font-size: 14px; line-height: 1.05; word-break: break-word; }
.item .t { min-width: 0; }
.item .t b { display: block; font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .t span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .r { text-align: right; font-size: 12px; color: var(--muted); white-space: nowrap; }
.pot { display: inline-flex; gap: 2px; vertical-align: middle; }
.pot i { width: 6px; height: 12px; border-radius: 2px; background: var(--line); }
.pot i.on { background: var(--fern); }
.pot.h i.on { background: var(--amber); }

/* karta místa */
.card { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
.back { align-self: flex-start; font-family: var(--font-display); font-weight: 600; font-size: 16px; background: none; border: 0; color: var(--fern); cursor: pointer; padding: 0; }
.card h2 { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.05; margin: 0; text-wrap: balance; }
.potrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.potrow b { font-family: var(--font-display); font-size: 18px; }
.badge { display: inline-flex; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; border: 1px solid; }
.b-ok { color: var(--fern); } .b-arch { color: var(--amber); } .b-warn { color: var(--sun); } .b-no { color: var(--carmine); }
.nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.btn { display: flex; align-items: center; justify-content: center; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); text-decoration: none;
  color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 18px; background: var(--panel); text-align: center; padding: 0 8px; }
.btn.go { grid-column: 1 / -1; background: var(--fern); border-color: var(--fern); color: var(--panel); font-size: 21px; min-height: 52px; }
.card h3 { font-family: var(--font-display); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.card p { margin: 0; }
.why { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.why a { font-size: 12px; color: var(--muted); }
.why q { display: block; font-size: 13px; font-style: italic; color: var(--muted); }
.box { border-left: 4px solid var(--fern); padding: 8px 12px; border-radius: 0 10px 10px 0; background: color-mix(in srgb, var(--fern) 8%, var(--panel)); font-size: 14px; }
.box.arch { border-left-color: var(--amber); background: color-mix(in srgb, var(--amber) 9%, var(--panel)); }
.box.no { border-left-color: var(--carmine); background: color-mix(in srgb, var(--carmine) 9%, var(--panel)); }
.box.warn { border-left-color: var(--sun); background: color-mix(in srgb, var(--sun) 10%, var(--panel)); }
.box a { color: inherit; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.kv { font-size: 12px; color: var(--muted); }

/* špendlíky a moje poloha */
.pinwrap { background: none; border: 0; padding: 0; cursor: pointer; }
.pin { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--fern); border: 2px solid var(--panel);
  box-shadow: var(--shadow); display: grid; place-items: center; }
.pin span { display: block; transform: rotate(45deg); font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--panel); }
.me { width: 18px; height: 18px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--me), var(--shadow); position: relative; }
.me::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--me); opacity: .6; animation: ping 2s ease-out infinite; }
@keyframes ping { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.6); opacity: 0; } }
.where { position: absolute; z-index: 5; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); top: calc(var(--bar-h, 120px) + 8px);
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 8px 8px 8px 12px; border-radius: 12px; background: var(--panel);
  border-left: 5px solid var(--muted); box-shadow: var(--shadow); font-size: 14px; line-height: 1.3; cursor: pointer; max-width: 560px; }
.where.ok { border-left-color: var(--fern); } .where.no { border-left-color: var(--carmine); } .where.arch { border-left-color: var(--amber); } .where.warn { border-left-color: var(--sun); }
.where b { display: block; font-family: var(--font-display); font-size: 16px; }
.where button { border: 0; background: none; color: var(--muted); font-size: 22px; cursor: pointer; padding: 0 6px; }
@media (min-width: 900px) { .where { left: 412px; } }
.attrib { position: absolute; z-index: 4; right: max(6px, env(safe-area-inset-right, 0px)); bottom: calc(46% + 4px); font-size: 10px; color: var(--muted);
  background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 1px 6px; border-radius: 6px; max-width: 70%; text-align: right; }
@media (min-width: 900px) { .attrib { bottom: 4px; } }
.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; font-family: var(--font-display); font-size: 20px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { #sheet { transition: none; } .me::after { animation: none; } }
</style>

</head>
<body>
<div id="app">
  <header class="bar" id="bar">
    <div class="top">
      <h1>Kapraď</h1><a class="place" id="place" href="../">Oblast</a><span class="sp"></span>
      <button class="round" id="locbtn" aria-pressed="false" title="Moje poloha">◎ Já</button>
      <button class="round" id="helpbtn" title="Pravidla a návod">?</button>
    </div>
    <div class="row what" id="what" role="group" aria-label="Co hledám"><span class="lbl">Hledám</span></div>
    <div class="row" id="maps" role="group" aria-label="Mapa"><span class="lbl">Mapa</span></div>
  </header>
  <div id="map"><div class="loading" id="loading">Načítám mapu…</div></div>
  <div class="attrib" id="attrib"></div>
  <div class="where" id="where" hidden role="status" aria-live="polite"><div id="wheretxt"></div><button id="whereclose" aria-label="Skrýt">×</button></div>
  <aside id="sheet" aria-label="Místa">
    <button class="handle" id="handle" aria-label="Zvětšit nebo zmenšit panel"><span></span></button>
    <div class="mode" id="mode"></div>
    <div class="content" id="content"></div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ---------------------------------------------------------------- slovníky
const CLASSES = {
  gold: { label: "Zlato", value: 10 }, coins: { label: "Mince", value: 1 }, silver: { label: "Stříbro", value: 4 },
  modern_jewelry: { label: "Šperky", value: 2 }, militaria: { label: "Militaria", value: 1 }, bronze: { label: "Bronz", value: 5 },
  natural_gold: { label: "Rýžování", value: 0, focusValue: 10 },  // zlato z potoka: do „Vše“ se nepočítá (jako v enginu)
};
const WHAT = { modern_jewelry: "dnešní šperky (prstýnky, řetízky)", coins: "mince", silver: "stříbro", gold: "zlato",
  militaria: "vojenské věci", bronze: "pravěký bronz", natural_gold: "zlato v potoce (rýžování)" };
const WHAT_OLD = { ...WHAT, coins: "staré mince (krejcary, groše)", modern_jewelry: "drobné šperky" };
const MAPS = [["dnes", "Dnes"], ["r1950", "1950"], ["r1880", "1880"], ["r1840", "1840"], ["relief", "Reliéf"], ["relief_detail", "Reliéf detail"]];
const WHY = {
  swimming_spot: "Koupaliště: lidé se převlékají a ve vodě i v trávě ztrácejí prstýnky a řetízky.",
  campsite: "Kemp: stany, ohně a posezení, ztrácejí se drobné, klíče i šperky.",
  sports_field: "Hřiště: při hře a na lavičkách padají mince a řetízky.",
  park: "Park: lavičky, cesty a akce, ztráty se tu sbírají desítky let.",
  picnic_site: "Odpočívadlo nebo vyhlídka: lidé tu sedají a vytahují peněženky.",
  ski_slope: "Sjezdovka: pády na sněhu, v létě leží ztráty v trávě.",
  recreation_ground: "Rekreační areál: akce, stánky a tancovačky.", festival_ground: "Louka pro slavnosti a poutě: davy lidí a stánky.",
  village_hist: "Stará ves {n}: staletí života, v okolí i starší mince.",
  church: "Kostel {n}: poutě a trhy u kostela.", chapel: "Kaple {n}: poutní místo.", wayside_cross: "Kříž nebo boží muka: zastavení poutníků.",
  castle: "Hrad nebo zámek {n}: panské sídlo, kolem něj ruch a obchod.", fortress_tvrz: "Tvrz {n}: sídlo zemanů.", ruin: "Rozvaliny staveb (zaniklé usedlosti nebo budovy) {n}.",
  hillfort: "Hradiště {n}: pravěké nebo slovanské opevnění.", rampart: "Val nebo hradba.",
  village_deserted_medieval: "Zaniklá ves: {n}.", village_deserted_1945: "Ves zaniklá po roce 1945: {n}.", farmstead_vanished: "Zaniklý statek: {n}.",
  battlefield: "Bojiště: {n}.", skirmish: "Šarvátka: {n}.", ww2_fighting: "Vojenský prostor nebo boje: {n}. Pozor na munici!", military_camp: "Vojenský tábor: {n}.", march_route: "Tudy táhla vojska: {n}.",
  ford: "Brod: přechod řeky, při brodění se ztrácelo.", ferry: "Přívoz: tady se platilo za převoz.", bridge_hist: "Starý most.",
  road_historic_map: "Stará cesta {n}.", hollow_way: "Úvoz: zahloubená stará cesta.", route_land_trail: "Zemská stezka: středověká dálková cesta. {n}",
  inn: "Hospoda: platilo se mincemi. {n}", mill: "Mlýn: jezdilo se sem s obilím a platilo. {n}", post_station: "Poštovní stanice: {n}",
  market_place: "Trh nebo jarmark: {n}", manor_farm: "Panský dvůr: {n}",
  silver_mine_hist: "Staré doly: {n}", gold_mine_hist: "Staré zlaté doly (pinky, štoly): {n}", mining_town: "Horní město: {n}",
  coin_find_hist: "Starý nález mincí: {n}", bronze_find_hist: "Nález bronzů: {n}", museum_record: "Archeologický nález: {n}",
  treasure_legend: "Pověst o pokladu: {n}", chronicle_event: "Z kroniky: {n}", pilgrimage_site: "Poutní místo: {n}",
  confluence: "Soutok: v pravěku oblíbené místo.", prominent_rock: "Výrazný vrch: pravěké obětiny.", spring: "Pramen: obětiny do vody.", holy_spring: "Svatý pramen: {n}",
};
const HOW = {
  swimming_spot: "Hledej v trávě a písku u vstupu do vody, u převlékáren a stánku. Nejlíp mimo sezónu.",
  campsite: "Kolem ohnišť, laviček, recepce a míst pro stany. Mimo sezónu a se souhlasem provozovatele.",
  sports_field: "U laviček, střídaček a tribuny a za brankami. Trávník po sobě urovnej.",
  park: "Pod lavičkami, podél cest, kolem velkých stromů a altánu. Park většinou patří obci.",
  picnic_site: "Kolem stolů, ohniště a vyhlídky, v okruhu asi 20 m.",
  ski_slope: "V létě v dojezdu, kolem vleků a bufetu.",
  recreation_ground: "Tam, kde stávají stany, stánky a pódium, a u vstupu.", festival_ground: "Tam, kde stávají stánky a pódium, a u vstupu.",
};
const MODERN = new Set(Object.keys(HOW));
const LEGAL = { landowner_consent: ["Se souhlasem majitele", "b-ok"], caution: ["Se souhlasem majitele, pozor", "b-warn"] };

// ---------------------------------------------------------------- stav a pomocníci
const S = { focus: "all", map: "dnes", mode: "hist", hsub: "places", sort: "best", data: {}, open: null, markers: [] };
const ME = { pos: null, watch: null, marker: null, fly: false, last: null, hideWhere: false };  // poloha jen v tomto prohlížeči
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function km(a1, o1, a2, o2) {
  const R = 6371, r = Math.PI / 180;
  const a = Math.sin((a2 - a1) * r / 2) ** 2 + Math.cos(a1 * r) * Math.cos(a2 * r) * Math.sin((o2 - o1) * r / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function dist(lat, lon) { const o = ME.pos || S.data.meta.center; return km(o.lat, o.lon, lat, lon); }
function distLabel(lat, lon) { const d = dist(lat, lon); return (d < 1 ? `${Math.round(d * 1000)} m` : `${d.toFixed(1)} km`) + (ME.pos ? "" : " od středu"); }
function center(f) { const r = f.geometry.coordinates[0]; let x = 0, y = 0; for (let i = 0; i < r.length - 1; i++) { x += r[i][0]; y += r[i][1]; } return [x / (r.length - 1), y / (r.length - 1)]; }
function shares(cls) {
  const e = Object.entries(cls || {}).filter(([c]) => CLASSES[c]);
  const tot = e.reduce((a, [, v]) => a + v, 0) || 1;
  return e.map(([c, v]) => [c, v / tot]).sort((a, b) => b[1] - a[1]);
}

// obecné důvody (bez jména) se sčítají; konkrétní (se jménem, z textů) jdou dopředu

// ---------------------------------------------------------------- data a pořadí podle toho, co hledám
async function load() {
  const names = ["meta", "potential", "opps", "zones"];
  const res = await Promise.all(names.map((n) => fetch(`data/${n}.json`).then((r) => r.json())));
  names.forEach((n, i) => (S.data[n] = res[i]));
  S.data.stories = await fetch("data/stories.json").then((r) => (r.ok ? r.json() : [])).catch(() => []);
  const byH3 = new Map(S.data.potential.features.map((f) => [f.properties.h3_r8, f]));
  S.data.stories.forEach((st) => (st._hex = byH3.get(st.h3)));
  S.data.potential.features.forEach((f, i) => { f.id = i; f.properties._c = center(f); });
  S.data.opps.features.forEach((f, i) => { f.id = i; });
  rank();
}
function rank() {
  const w = {};
  for (const [c, d] of Object.entries(CLASSES)) w[c] = S.focus === "all" ? d.value : c === S.focus ? (d.focusValue || d.value) : d.value * 0.05;
  for (const [fc, key] of [[S.data.opps, "classes"], [S.data.potential, "cls"]]) {
    for (const f of fc.features) {
      let u = 0;
      for (const [c, v] of Object.entries(f.properties[key] || {})) u += (w[c] || 0) * v;
      f.properties._u = key === "classes" ? u * (f.properties.score || 1) : u;
    }
    const sorted = [...fc.features].sort((a, b) => b.properties._u - a.properties._u);
    sorted.forEach((f, i) => { f.properties._rank = i + 1; f.properties._p = Math.round(100 * (1 - i / Math.max(1, sorted.length - 1))); });
  }
}

  const p = f.properties;
  selectHex(id);
  map.easeTo({ center: p._c, zoom: Math.max(map.getZoom(), 13), duration: 500, padding: innerWidth >= 900 ? { left: 400 } : { bottom: innerHeight * 0.46 } });
  showCard(`<h2>${p._rank}. Historické místo${p.obec ? ` u obce ${esc(p.obec)}` : ""}</h2>
    <div class="potrow">Potenciál ${potBars(p._p, true)} <b>${potWord(p._p)}</b> · ${distLabel(p._c[1], p._c[0])} <span class="badge b-arch">Jen s archeology</span></div>
    <section><h3>Proč zrovna tady</h3>${whyHtml(whyItems(p.reasons))}</section>
    <section><h3>Co se tu skrývá</h3><p>${esc(whatLine(p.cls, true))}${eraOf(p.reasons) ? ` · ${esc(eraOf(p.reasons))}` : ""}</p></section>
    <section><h3>Jak to legálně prohledat</h3><ol class="steps">
      <li><b>Zapiš se do AMČR-PAS</b> a absolvuj školení. <a href="https://amcr-info.aiscr.cz/amcr-pas/" target="_blank" rel="noopener">amcr-info.aiscr.cz</a></li>
      <li><b>Domluv se s muzeem</b> nebo archeologickým ústavem, který v okolí pracuje, že tu chceš hledat.</li>
      <li><b>Souhlas majitele pozemku.</b></li>
      <li>Nálezy zapiš do AMČR-PAS (poloha, hloubka, fotky) a předej.</li></ol></section>
    <div class="box arch">Po dohodě tu Kapraď ukáže přesná místa, navigaci a záznam nálezů. Do té doby proto chybí navigace.</div>
    <div class="box no"><b>Bez dohody tu nekopej.</b> Hledat staré předměty bez oprávnění je přestupek (pokuta až 2 mil. Kč) a nálezy patří kraji.</div>`);
}
function selectHex(id) {
  if (!map?.getSource("potential")) return;
  if (S.selHex != null) map.setFeatureState({ source: "potential", id: S.selHex }, { sel: false });
  S.selHex = id;
  if (id != null) map.setFeatureState({ source: "potential", id }, { sel: true });
}
function openZone(p) {
  const cls = p.level === "forbidden" ? ["no", "Zákaz"] : p.level === "archaeologist_only" ? ["arch", "Jen s archeology"] : ["warn", "Pozor"];
  showCard(`<h2>${esc(p.name || "Zóna")}</h2><div class="box ${cls[0]}"><b>${cls[1]}.</b> ${esc(p.basis || "")}</div>`);
}
function openHelp() {
  const m = S.data.meta;
  showCard(`<h2>Jak na to</h2>
    <ol class="steps"><li><b>Hledám</b> nahoře seřadí místa podle toho, co chceš najít (zlato, mince, stříbro, bronz…).</li>
      <li><b>Historie</b> ukáže, kde v krajině leží staré nálezy a proč. Prohledat se dají legálně přes AMČR-PAS, pak aplikace odemkne přesná místa a navigaci.</li>
      <li><b>Dnešní ztráty</b> jsou zelená čísla: tam smíš hledat hned, se souhlasem majitele (koupaliště, kempy, hřiště, parky). Karta má velké tlačítko <b>Navigovat</b>.</li>
      <li><b>Mapa</b> přepíná staré mapy (1840, 1880, 1950) a reliéf. Posuvníkem je prolneš s dneškem.</li>
      <li><b>◎ Já</b> ukáže, kde stojíš, a řekne, jestli tu smíš hledat. Poloha zůstává jen v tvém telefonu, nikam se neposílá.</li></ol>
    <div class="box no"><b>Červená = nikdy</b> (hřbitov, památka, rezervace). <b>Historie</b> jen s archeology. <b>Munice:</b> nesahej, volej 158.</div>
    ${m.guide ? `<a class="btn" href="${esc(m.guide)}" target="_blank" rel="noopener">Návod na 1 stránku (PDF)</a>` : ""}
    <p class="kv">Pilot ${esc(m.date || "")}. ${(m.caveats || []).map(esc).join(" ")}</p>`);
}

// ---------------------------------------------------------------- moje poloha (jen v prohlížeči, nikam se neposílá)
function inRing(x, y, ring) {
  let ins = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
function inGeom(lon, lat, g) {
  const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
  return polys.some((rings) => inRing(lon, lat, rings[0]) && !rings.slice(1).some((h) => inRing(lon, lat, h)));
}
function bboxOf(g) {
  let b = [180, 90, -180, -90];
  const walk = (c) => (typeof c[0] === "number" ? (b = [Math.min(b[0], c[0]), Math.min(b[1], c[1]), Math.max(b[2], c[0]), Math.max(b[3], c[1])]) : c.forEach(walk));
  walk(g.coordinates);
  return b;
}
function hits(fc, lon, lat) {
  return fc.features.filter((f) => {
    const b = f._bb || (f._bb = bboxOf(f.geometry));
    return lon >= b[0] && lon <= b[2] && lat >= b[1] && lat <= b[3] && inGeom(lon, lat, f.geometry);
  });
}
function whereText() {
  const { lat, lon } = ME.pos, m = S.data.meta;
  const fromC = km(m.center.lat, m.center.lon, lat, lon);
  if (fromC > m.radius_km + 2) return ["", `<b>Jsi mimo oblast ${esc(m.place || "")}</b>${fromC.toFixed(0)} km od středu. Jinou oblast vybereš nahoře u názvu.`];
  const z = hits(S.data.zones, lon, lat);
  const zf = z.find((f) => f.properties.level === "forbidden");
  if (zf) return ["no", `<b>Stojíš v zóně ZÁKAZ</b>${esc(zf.properties.name || "")}: tady nehledej.`];
  const o = hits(S.data.opps, lon, lat)[0];
  if (o) return ["ok", `<b>Jsi na místě č. ${o.properties._rank}: ${esc(o.properties.headline || "")}</b>Se souhlasem majitele tu můžeš hledat.`, () => openOpp(o.id)];
  const za = z.find((f) => f.properties.level === "archaeologist_only"), hx = hits(S.data.potential, lon, lat)[0];
  const best = [...S.data.opps.features].sort((a, b) => dist(a.properties.lat, a.properties.lon) - dist(b.properties.lat, b.properties.lon))[0];
  const tip = best ? ` Nejbližší místo k hledání: č. ${best.properties._rank} ${esc(best.properties.headline || "")}, ${distLabel(best.properties.lat, best.properties.lon)}.` : "";
  const goBest = best ? () => openOpp(best.id) : null;
  if (za || hx) return ["arch", `<b>Historické území</b>Bez archeologů tu nekopej.${tip}`, goBest];
  const zc = z.find((f) => f.properties.level === "caution");
  if (zc) return ["warn", `<b>Pozor: ${esc(zc.properties.name || "")}</b>${esc(zc.properties.basis || "")}.${tip}`, goBest];
  return ["", `<b>Tady nic vyznačeného</b>Jen se souhlasem majitele a jen dnešní ztráty.${tip}`, goBest];
}
function updateWhere() {
  if (!ME.pos || ME.hideWhere) return;
  const [cls, html, act] = whereText(), w = $("where");
  w.className = "where " + cls;
  $("wheretxt").innerHTML = html;
  w.onclick = (e) => { if (e.target.id !== "whereclose" && act) act(); };
  w.hidden = false;
}
function drawMe() {
  const { lat, lon, acc } = ME.pos;
  if (!ME.marker) {
    const el = document.createElement("div");
    el.className = "me"; el.setAttribute("aria-label", "Moje poloha");
    ME.marker = new maplibregl.Marker({ element: el }).setLngLat([lon, lat]).addTo(map);
  } else ME.marker.setLngLat([lon, lat]);
  const poly = { type: "Feature", geometry: { type: "Polygon", coordinates: [circle(lon, lat, Math.max(acc, 5) / 1000)] } };
  if (map.getSource("me-acc")) map.getSource("me-acc").setData(poly);
  else {
    map.addSource("me-acc", { type: "geojson", data: poly });
    map.addLayer({ id: "me-acc", type: "fill", source: "me-acc", paint: { "fill-color": css("--me"), "fill-opacity": 0.12 } });
  }
}
function onPos(p) {
  ME.pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy || 50 };
  if (S.ready) applyPos();  // jinak až po načtení mapy
}
function applyPos() {
  drawMe();
  const m = S.data.meta;
  if (ME.fly && km(m.center.lat, m.center.lon, ME.pos.lat, ME.pos.lon) <= m.radius_km + 2) map.easeTo({ center: [ME.pos.lon, ME.pos.lat], zoom: Math.max(map.getZoom(), 14), duration: 600 });
  if (ME.fly && S.sort === "best") S.sort = "near";
  ME.fly = false;
  updateWhere();
  const moved = !ME.last || km(ME.last.lat, ME.last.lon, ME.pos.lat, ME.pos.lon) > 0.05;  // seznam jen po pohybu o víc než 50 m
  if (moved) { ME.last = { ...ME.pos }; if (!S.open) { const c = $("content"), y = c.scrollTop; render(); c.scrollTop = y; } }
}
function onErr(e) {
  stopLocate();
  const w = $("where");
  w.className = "where warn";
  $("wheretxt").innerHTML = e.code === 1 ? "<b>Poloha je zakázaná</b>Povol ji v nastavení prohlížeče. V náhledu na claude.ai poloha nejde, otevři odkaz z GitHubu."
    : "<b>Polohu se nepodařilo zjistit</b>Zkus to venku nebo za chvíli znovu.";
  w.onclick = null;
  w.hidden = false;
}
function startLocate(fly) {
  if (!("geolocation" in navigator)) return onErr({ code: 2 });
  ME.fly = fly; ME.hideWhere = false;
  $("locbtn").setAttribute("aria-pressed", "true");
  if (ME.pos && fly && S.ready) {
    ME.fly = false;
    const m = S.data.meta;
    if (km(m.center.lat, m.center.lon, ME.pos.lat, ME.pos.lon) <= m.radius_km + 2) map.easeTo({ center: [ME.pos.lon, ME.pos.lat], zoom: Math.max(map.getZoom(), 14), duration: 600 });
    S.sort = "near";
    updateWhere();
    if (!S.open) render();
  }
  if (ME.watch == null) ME.watch = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
}
function stopLocate() {
  if (ME.watch != null) navigator.geolocation.clearWatch(ME.watch);
  ME.watch = null;
  $("locbtn").setAttribute("aria-pressed", "false");
}

// ---------------------------------------------------------------- start
$("locbtn").addEventListener("click", () => startLocate(true));
$("helpbtn").addEventListener("click", openHelp);
$("whereclose").addEventListener("click", (e) => { e.stopPropagation(); ME.hideWhere = true; $("where").hidden = true; });
$("handle").addEventListener("click", () => {
  const s = $("sheet");
  if (s.classList.contains("min")) s.classList.remove("min");
  else if (s.classList.contains("max")) { s.classList.remove("max"); s.classList.add("min"); }
  else s.classList.add("max");
});
load().then(() => { buildBar(); setBarH(); render(); initMap(); }).catch((e) => {
  $("loading").textContent = "Data se nepodařilo načíst. Zkus stránku obnovit.";
  console.error(e);
});
</script>
