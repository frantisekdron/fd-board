const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(E.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(E.iv)},key,b(E.data));
  return new TextDecoder().decode(raw);
}
function show(html){document.open();document.write(html);document.close();}
async function tryPw(pw,remember){
  try{const html=await dec(pw);if(remember){try{localStorage.setItem('v7_pw',pw)}catch(e){}}try{sessionStorage.setItem('nd_pw',pw)}catch(e){}show(html);return true;}
  catch(e){return false;}
}
(async()=>{let s='';try{s=localStorage.getItem('v7_pw')||''}catch(e){}if(s&&await tryPw(s,false))return;})();
document.getElementById('f').onsubmit=async ev=>{ev.preventDefault();
  const ok=await tryPw(document.getElementById('pw').value,document.getElementById('rem').checked);
  if(!ok)document.getElementById('err').textContent='Špatné heslo.';};
</script></body></html>
