<!doctype html>
<html lang="cs"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Velín">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>FD Velín</title>
<style>
:root{
  --bg:#07090c;--bg2:#0d1116;--card:#11161ccc;--line:#1c2530;--fg:#eef3f7;--dim:#8293a3;--mute:#56636f;
  --acc:#35e0d0;--acc2:#7c6cff;--wait:#ffb547;--run:#35e0d0;--ok:#6ee787;--err:#ff6b7a;
  --r:18px;--safe-b:env(safe-area-inset-bottom);
}
:root[data-theme="light"]{--bg:#f4f6f8;--bg2:#fff;--card:#ffffffd9;--line:#e3e8ee;--fg:#0b1218;--dim:#5b6874;--mute:#94a0ab}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}
body{min-height:100dvh;background:
  radial-gradient(900px 500px at 85% -10%,#35e0d014,transparent 60%),
  radial-gradient(700px 500px at -10% 110%,#7c6cff12,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px calc(150px + var(--safe-b))}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-weight:700;color:#041014}
header h1{font-size:18px;margin:0;letter-spacing:.02em}
header .sub{font-size:12px;color:var(--dim)}
header .sp{flex:1}
.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg2)}
.icon svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;backdrop-filter:blur(12px);text-align:left}
.stat b{display:block;font-size:24px;font-weight:700}
.stat span{font-size:12px;color:var(--dim)}
.stat.on{outline:2px solid var(--acc)}
.stat.w b{color:var(--wait)} .stat.r b{color:var(--run)} .stat.d b{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--dim)}
.seg button.on{background:var(--line);color:var(--fg)}
.search{flex:1;min-width:160px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--fg);font:inherit}
.btn{padding:9px 14px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#2bc4b6);color:#041014;font-weight:600}
.btn.ghost{background:var(--bg2);border:1px solid var(--line);color:var(--fg);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;backdrop-filter:blur(12px);animation:in .35s ease both;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c,var(--mute))}
.card.wait{--c:var(--wait)} .card.run{--c:var(--run)} .card.done{--c:var(--ok)} .card.err{--c:var(--err)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.top{display:flex;gap:8px;align-items:flex-start}
.top h3{margin:0;font-size:15px;font-weight:600;flex:1;line-height:1.3}
.chip{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.st{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.card.run .dot{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.sum{color:var(--dim);font-size:13.5px;margin:8px 0}
.need{font-size:13px;background:color-mix(in srgb,var(--wait) 10%,transparent);border:1px solid color-mix(in srgb,var(--wait) 30%,transparent);color:var(--fg);padding:8px 10px;border-radius:12px;margin:8px 0}
.meta{font-size:11.5px;color:var(--mute);display:flex;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts button,.acts a{font-size:12.5px;padding:7px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);text-decoration:none}
.acts .pri{border-color:color-mix(in srgb,var(--acc) 50%,transparent);color:var(--acc)}
.empty{color:var(--dim);text-align:center;padding:40px 0}
.queue{margin:18px 0 0;font-size:13px;color:var(--dim)}
.queue div{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px dashed var(--line);border-radius:12px;margin-top:6px}
.queue div span{flex:1}
/* hlasový dok */
.dock{position:fixed;left:50%;bottom:calc(16px + var(--safe-b));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));background:color-mix(in srgb,var(--bg2) 88%,transparent);border:1px solid var(--line);border-radius:26px;padding:10px 10px 10px 18px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(18px);box-shadow:0 20px 60px #0007;z-index:5}
.dock .txt{flex:1;min-width:0;font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .txt b{color:var(--fg);font-weight:500}
.orb{position:relative;width:64px;height:64px;flex:none;border-radius:50%}
.orb canvas{position:absolute;inset:-28px;width:120px;height:120px;pointer-events:none}
.orb .core{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b6fff8,var(--acc) 40%,var(--acc2));box-shadow:0 0 24px #35e0d066;display:grid;place-items:center;transition:transform .15s}
.orb .core svg{width:22px;height:22px;color:#041014}
.orb.live .core{animation:breathe 2.4s ease-in-out infinite}
.orb.think .core{animation:spin 1.1s linear infinite;background:conic-gradient(from 0deg,var(--acc),var(--acc2),var(--acc))}
.orb.speaking .core{animation:talk .5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes talk{to{transform:scale(1.12);box-shadow:0 0 40px #7c6cffaa}}
.dock .think{background:linear-gradient(90deg,var(--dim),var(--fg),var(--dim));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@keyframes breathe{50%{transform:scale(1.06)}}
/* modal */
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:9;backdrop-filter:blur(4px)}
.sheet.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{width:min(560px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + var(--safe-b));animation:up .25s ease}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.panel h2{margin:0 0 4px;font-size:17px}
.panel p{margin:0 0 12px;color:var(--dim);font-size:13px}
.panel label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
.panel input,.panel textarea,.panel select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--fg);font:inherit}
.panel textarea{min-height:110px;resize:vertical}
.panel .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.mic{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--acc);margin-top:6px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-size:14px;z-index:20;display:none}
.toast.show{display:block;animation:up .2s}
/* ⚡ Obnovit teď – hlavní tlačítko */
.run{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 12px;border-radius:14px;font-weight:700;font-size:14px;color:#1a1200;
  background:linear-gradient(135deg,#ffd84d,#ffb547);box-shadow:0 0 0 1px #ffb54766,0 6px 22px #ffb54755;transition:transform .12s,filter .2s}
.run svg{width:20px;height:20px}
.run:hover{filter:brightness(1.06)} .run:active{transform:scale(.95)}
.run.busy{pointer-events:none;background:linear-gradient(135deg,#ffe58a,#ffd27a)}
.run.busy svg{animation:zap .7s ease-in-out infinite alternate}
.run.done{background:linear-gradient(135deg,#6ee787,#35e0d0);box-shadow:0 0 0 1px #6ee78766,0 6px 22px #6ee78755}
@keyframes zap{from{transform:scale(.8);opacity:.5}to{transform:scale(1.15);opacity:1}}
@media(max-width:560px){.run span{display:none}.run{padding:0 11px}}
/* Velín – doplňky */
.tabs{margin-bottom:14px}
.view{display:none}.view.on{display:block}
.panel.wide{width:min(1100px,100%)}
.panel{max-height:92dvh;overflow:auto}
.panel .nav{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.panel .nav .sp{flex:1}
.sec{margin-top:16px}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:600}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:baseline;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left;width:100%;min-width:0}
.item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:11.5px;color:var(--mute);white-space:nowrap}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px}
pre.code{margin:0;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:70dvh;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;white-space:pre}
pre.code .a{color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent);display:inline-block;min-width:100%}
pre.code .d{color:var(--err);background:color-mix(in srgb,var(--err) 8%,transparent);display:inline-block;min-width:100%}
pre.code .h{color:var(--acc2)} pre.code .f{color:var(--acc);font-weight:600}
.ci{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.ci.ok{color:var(--ok)} .ci.err{color:var(--err)} .ci.run{color:var(--wait)}
.ev{padding:10px 12px;border-left:3px solid var(--line);background:var(--card);border-radius:0 12px 12px 0}
.ev b{font-weight:600}.ev .s{font-size:11.5px;color:var(--mute)}
.note{font-size:13px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);color:var(--dim);margin-bottom:12px}
.login{max-width:360px;margin:12vh auto;text-align:center}
.login input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:inherit;margin:14px 0}
</style>
</head><body>
<div class="wrap" id="app" hidden>
  <header>
    <div class="logo">V</div>
    <div><h1>FD Velín</h1><div class="sub" id="age">načítám…</div></div>
    <div class="sp"></div>
    <button class="run" id="runNow" title="Spustit Dispečera hned"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Obnovit teď</span></button>
    <button class="icon" id="refresh" title="Načíst znovu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg></button>
    <button class="icon" id="speakAll" title="Přečíst, co čeká"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button>
    <button class="icon" id="settings" title="Nastavení"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </header>

  <div class="seg tabs" id="tabs">
    <button data-v="sessions" class="on">Session</button><button data-v="repos">Repa</button><button data-v="history">Historie</button>
  </div>

  <section class="view on" id="v-sessions">
    <div id="notes"></div>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <div class="seg" id="where">
        <button data-v="all" class="on">Vše</button><button data-v="cloud">☁ Cloud</button><button data-v="mac">💻 Mac</button>
      </div>
      <input class="search" id="q" placeholder="Hledat session…">
      <button class="btn" id="newBtn">+ Nová session</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="queue" id="queue"></div>
  </section>

  <section class="view" id="v-repos">
    <div class="bar"><input class="search" id="rq" placeholder="Hledat repo…"></div>
    <div class="list" id="repos"><div class="empty">Načítám repa…</div></div>
  </section>

  <section class="view" id="v-history">
    <div class="bar"><select class="search" id="hs"><option value="">Všechny session</option></select></div>
    <div class="list" id="hist"></div>
  </section>
</div>

<div class="login" id="login" hidden>
  <div class="logo" style="margin:0 auto">V</div>
  <h1 style="font-size:20px">FD Velín</h1>
  <form id="loginForm"><input id="heslo" type="password" placeholder="Heslo" autocomplete="current-password"><button class="btn" style="width:100%">Přihlásit</button></form>
</div>

<div class="dock" id="dock" hidden>
  <button class="orb" id="orb" aria-label="Mluvit"><canvas id="viz" width="240" height="240"></canvas><span class="core"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></button>
  <div class="txt" id="dockTxt"><b>Klepni jednou a mluv.</b> „Co čeká?" · „FD STUDIO, ať…" · „Nová session…" · „Stop"</div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const store = {
  get(k){ try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
};
let data = { sessions: [], events: [], updated_at: null }, queue = { commands: [] }, spoust = false;
let filt = { where: "all", state: "all", q: "" }, repos = null, OWNER = "";

/* ---------- server Velínu ---------- */
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, cache: "no-store", headers: { "content-type": "application/json", ...(opt.headers || {}) } });
  if (r.status === 401 && path !== "/api/login") { showLogin(); throw new Error("Přihlas se"); }
  const ct = r.headers.get("content-type") || "";
  const out = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(out?.error || out?.message || "Chyba " + r.status);
  return out;
}
const ghApi = (p, mode = "") => api(`/api/gh?p=${encodeURIComponent(p)}${mode ? "&" + mode + "=1" : ""}`);

function showLogin() { $("#app").hidden = true; $("#dock").hidden = true; $("#login").hidden = false; $("#heslo").focus(); }
$("#loginForm").onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ heslo: $("#heslo").value }) });
    $("#heslo").value = ""; $("#login").hidden = true; load();
  } catch (err) { toast(err.message); }
};

async function load() {
  try {
    const r = await api("/api/state");
    data = r.state || data; spoust = r.spoust; OWNER = r.owner || "";
    if (!Array.isArray(data.sessions)) data.sessions = [];
    if (!Array.isArray(data.events)) data.events = [];
    queue = r.queue || {}; if (!Array.isArray(queue.commands)) queue.commands = [];
    $("#app").hidden = false; $("#dock").hidden = false;
    render();
  } catch (e) { if (!/Přihlas/.test(e.message)) toast(e.message); }
}
async function pushCommand(cmd) {
  const r = await api("/api/command", { method: "POST", body: JSON.stringify(cmd) });
  queue = r.queue; render();
  toast(r.fired ? "Odesláno – Dispečer už běží ✓" : "Zařazeno ✓ " + (r.fireError ? "(" + r.fireError + ")" : ""));
  return r;
}
async function dropCommand(i) {
  const c = queue.commands[i]; if (!c) return;
  const r = await api("/api/command?at=" + encodeURIComponent(c.at), { method: "DELETE", body: JSON.stringify({ at: c.at }) });
  queue = r.queue; render();
}
async function runNow() {
  const b = $("#runNow"), label = b.querySelector("span");
  if (b.classList.contains("busy")) return; // ochrana proti dvojkliku
  b.classList.add("busy"); label.textContent = "Spouštím…";
  try {
    await api("/api/run", { method: "POST" });
    b.classList.replace("busy", "done"); label.textContent = "Dispečer běží";
    toast("⚡ Dispečer spuštěn – nový stav a notifikace do pár minut");
    setTimeout(load, 180000);
  } catch (e) { b.classList.remove("busy"); label.textContent = "Obnovit teď"; toast(e.message); return; }
  setTimeout(() => { b.classList.remove("done"); label.textContent = "Obnovit teď"; }, 60000);
}

/* ---------- render ---------- */
const ST = {
  blocked: ["wait", "Čeká na tebe"], review_ready: ["wait", "K revizi"], working: ["run", "Běží"],
  completed: ["done", "Hotovo"], failed: ["err", "Chyba"],
};
const st = (s) => ST[s.stav] || ["", s.stav || "?"];
const ago = (iso) => { if (!iso) return ""; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? "teď" : m < 60 ? `před ${m} min` : m < 1440 ? `před ${Math.round(m / 60)} h` : `před ${Math.round(m / 1440)} d`; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const enc = encodeURIComponent;

function render() {
  $("#age").textContent = data.updated_at ? `Dispečer aktualizoval ${ago(data.updated_at)}${spoust ? " · ⚡ spoušť aktivní" : " · každou hodinu"}` : "Zatím bez dat";
  const notes = Object.entries(data.poznamky || {}).concat(["mac", "velin"].filter((k) => data[k]).map((k) => [k, data[k]]));
  $("#notes").innerHTML = notes.map(([k, t]) => `<div class="note"><b>${esc(k === "velin" ? "Velín" : k === "mac" ? "Mac" : k)}:</b> ${esc(t)}</div>`).join("");
  const S = data.sessions;
  const cnt = (f) => S.filter(f).length;
  const tiles = [
    ["all", "", S.length, "Session"],
    ["wait", "w", cnt((s) => st(s)[0] === "wait"), "Čeká na tebe"],
    ["run", "r", cnt((s) => st(s)[0] === "run"), "Běží"],
    ["err", "", cnt((s) => st(s)[0] === "err"), "Chyba"],
    ["done", "d", cnt((s) => st(s)[0] === "done"), "Hotovo"],
  ];
  $("#stats").style.gridTemplateColumns = innerWidth < 560 ? "" : "repeat(5,1fr)";
  $("#stats").innerHTML = tiles.map(([k, c, n, l]) => `<button class="stat ${c} ${filt.state === k ? "on" : ""}" data-k="${k}"><b ${k === "err" && n ? 'style="color:var(--err)"' : ""}>${n}</b><span>${l}</span></button>`).join("");
  $("#stats").querySelectorAll(".stat").forEach((b) => (b.onclick = () => { filt.state = b.dataset.k; render(); }));

  const order = { wait: 0, err: 1, run: 2, done: 3 };
  const rows = S.filter((s) =>
    (filt.where === "all" || s.typ === filt.where) &&
    (filt.state === "all" || st(s)[0] === filt.state) &&
    (!filt.q || [s.title, s.shrnuti, s.ceka, s.repo].join(" ").toLowerCase().includes(filt.q))
  ).sort((a, b) => (order[st(a)[0]] ?? 9) - (order[st(b)[0]] ?? 9) || Date.parse(b.updated || 0) - Date.parse(a.updated || 0));

  $("#grid").innerHTML = rows.length ? rows.map((s) => {
    const [cls, label] = st(s);
    const pending = queue.commands.filter((c) => c.session === s.id).length;
    return `<article class="card ${cls}">

/* ---------- hlas: diktování + vizualizace ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, audioCtx, analyser, micStream, raf, level = 0;
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "cs-CZ"; speechSynthesis.speak(u); } catch {} }

async function startViz() {
  try {
    const ms = await navigator.mediaDevices.getUserMedia({ audio: true });
    if (!rec) { ms.getTracks().forEach((t) => t.stop()); return; }
    micStream = ms;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(micStream).connect(analyser);
  } catch {}
}
function stopViz() { micStream?.getTracks().forEach((t) => t.stop()); micStream = null; audioCtx?.close().catch(() => {}); audioCtx = null; analyser = null; }
function draw() {
  const c = $("#viz"), g = c.getContext("2d"), W = c.width, cx = W / 2;
  const buf = new Uint8Array(128);
  let t = 0;
  (function frame() {
    t += 0.016;
    g.clearRect(0, 0, W, W);
    if (analyser) { analyser.getByteFrequencyData(buf); level += ((buf.slice(2, 40).reduce((a, b) => a + b, 0) / 38 / 255) - level) * 0.3; }
    else level *= 0.92;
    const live = $("#orb").classList.contains("live") || $("#orb").classList.contains("speaking");
    if (live || level > 0.01) {
      for (let ring = 0; ring < 3; ring++) {
        g.beginPath();
        const base = 46 + ring * 7, amp = 6 + level * 46 * (1 - ring * 0.25);
        for (let i = 0; i <= 120; i++) {
          const a = (i / 120) * Math.PI * 2;
          const f = analyser ? buf[(i * 3 + ring * 9) % 64] / 255 : 0.2;
          const r = base + Math.sin(a * (3 + ring) + t * (2 + ring)) * amp * 0.35 + f * amp;
          const x = cx + Math.cos(a) * r, y = cx + Math.sin(a) * r;
          i ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        const grad = g.createLinearGradient(0, 0, W, W);
        grad.addColorStop(0, `rgba(53,224,208,${0.75 - ring * 0.2})`); grad.addColorStop(1, `rgba(124,108,255,${0.75 - ring * 0.2})`);
        g.strokeStyle = grad; g.lineWidth = 2.4 - ring * 0.5; g.shadowBlur = 14; g.shadowColor = "#35e0d0";
        g.stroke();
      }
    }
    raf = requestAnimationFrame(frame);
  })();
}
draw();

function listen(onFinal) {
  if (!SR) { toast("Diktování v tomhle prohlížeči nejde – použij Safari nebo Chrome"); return; }
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = "cs-CZ"; rec.interimResults = true; rec.continuous = false;
  let finalText = "";
  rec.onstart = () => { $("#orb").classList.add("live"); if (!/iP(hone|ad|od)/.test(navigator.userAgent)) startViz(); };
  rec.onresult = (e) => {
    let s = ""; for (const r of e.results) { s += r[0].transcript; if (r.isFinal) finalText = s; }
    $("#dockTxt").innerHTML = `<b>${esc(s)}</b>`;
  };
  rec.onerror = (e) => toast("Mikrofon: " + e.error);
  rec.onend = () => { $("#orb").classList.remove("live"); stopViz(); rec = null; if (finalText.trim()) onFinal(finalText.trim()); };
  rec.start();
}
function dictateInto(el) { listen((t) => { el.value = (el.value ? el.value + " " : "") + t; }); }

// Hlasové příkazy: rozpozná cíl session podle názvu
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function route(t) {
  const n = norm(t);
  if (/^(co ceka|co se deje|prehled|stav)/.test(n)) return readOut();
  if (/^(nova|zaloz)/.test(n)) return newSheet(t.replace(/^\S+\s+(session\s+)?/i, ""));
  let best = null, score = 0;
  for (const s of data.sessions) {
    const words = norm(s.title).split(/\W+/).filter((w) => w.length > 2);
    const hit = words.filter((w) => n.includes(w)).length / (words.length || 1);
    if (hit > score) { score = hit; best = s; }
  }
  if (best && score >= 0.5) {
    const cut = norm(best.title).split(/\W+/).filter((w) => w.length > 2).pop();
    const i = n.lastIndexOf(cut);
    const text = i >= 0 ? t.slice(i + cut.length).replace(/^[\s,.:–-]*(at|ze|a)?\s*/i, "") : t;
    return msgSheet(best, text);
  }
  newSheet(t);
}
function readOut() {
  const w = data.sessions.filter((s) => st(s)[0] === "wait");
  say(w.length ? `Na tebe čeká ${w.length}. ` + w.map((s) => `${s.title}: ${s.ceka || s.shrnuti}`).join(". ") : "Nic na tebe nečeká.");
}
/* ---------- režim konverzace: jedno klepnutí, pak jen mluvíš ---------- */
let convo = false, crec = null, speaking = false, lastSaid = "";
// ochrana proti ozvěně: když mikrofon zachytí můj vlastní hlas z reproduktoru, ignoruj to
const echo = (t) => { const a = norm(t).split(/\W+/).filter((w) => w.length > 2); const b = new Set(norm(lastSaid).split(/\W+/)); return a.length && a.filter((w) => b.has(w)).length / a.length > 0.6; };
function status(t, cls = "") { $("#dockTxt").innerHTML = `<b class="${cls}">${t}</b>`; }
function talk(t) {
  return new Promise((res) => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t); u.lang = "cs-CZ"; u.rate = 1.05; lastSaid = t;
      speaking = true; $("#orb").classList.add("speaking"); status(esc(t));
      u.onend = u.onerror = () => { speaking = false; $("#orb").classList.remove("speaking"); res(); };
      speechSynthesis.speak(u);
    } catch { res(); }
  });
}
function matchSession(n) {
  let best = null, score = 0;
  for (const s of data.sessions || []) {
    const words = norm(s.title || "").split(/\W+/).filter((w) => w.length > 2);
    const hit = words.filter((w) => n.includes(w)).length / (words.length || 1);
    if (hit > score) { score = hit; best = s; }
  }
  return score >= 0.5 ? best : null;
}
async function handle(t) {
  const n = norm(t);
  status("Zpracovávám…", "think"); $("#orb").classList.add("think");
  try {
    if (/^(stop|konec|dik|diky|dekuju)\b/.test(n)) { await talk("Jasně, končím."); return stopConvo(); }
    if (/(co ceka|co se deje|prehled|jak to vypada|stav)/.test(n)) {
      await load();
      const w = (data.sessions || []).filter((s) => st(s)[0] === "wait");
      return talk(w.length ? `Na tebe čeká ${w.length}. ` + w.map((s) => `${s.title}: ${s.ceka || s.shrnuti}`).join(". ") : "Nic na tebe nečeká.");
    }
    if (/^(nova|zaloz)/.test(n)) {
      const text = t.replace(/^\S+\s+(session\w*\s+)?/i, "").trim();
      if (!text) return talk("Co má nová session dělat?");
      await pushCommand({ typ: "nova", nazev: text.split(/\s+/).slice(0, 5).join(" "), repo: "", text });
      return talk("Hotovo, nová session je ve frontě.");
    }
    const s = matchSession(n);
    if (s) {
      const cut = norm(s.title).split(/\W+/).filter((w) => w.length > 2).pop();
      const i = n.lastIndexOf(cut);
      const text = (i >= 0 ? t.slice(i + cut.length) : t).replace(/^[\s,.:–-]*(at|ať|ze|že|a)?\s*/i, "").trim();
      if (/^(jak|co dela|stav)/.test(n) || !text) return talk(`${s.title}: ${st(s)[1]}. ${s.ceka || s.shrnuti || ""}`);
      await pushCommand({ typ: "zprava", session: s.id, text });
      return talk(`Posláno do ${s.title}.${s.typ === "mac" && !s.online ? " Mac je offline, dorazí po zapnutí." : ""}`);
    }
    return talk("Nevím, do které session to patří. Řekni její název, nebo začni slovem nová.");
  } catch (e) { return talk("Nepovedlo se: " + e.message); }
  finally { $("#orb").classList.remove("think"); }
}
function startConvo() {
  if (!SR) return toast("Hlas v tomhle prohlížeči nejde – použij Safari nebo Chrome");
  convo = true; $("#orb").classList.add("live"); status("Poslouchám…");
  const loop = () => {
    if (!convo) return;
    crec = new SR(); crec.lang = "cs-CZ"; crec.interimResults = true; crec.continuous = false;
    let fin = "";
    crec.onresult = (e) => {
      let x0 = ""; for (const r of e.results) x0 += r[0].transcript;
      if (speaking && !echo(x0)) { speechSynthesis.cancel(); speaking = false; $("#orb").classList.remove("speaking"); } // skočíš mi do řeči
      let x = ""; for (const r of e.results) { x += r[0].transcript; if (r.isFinal) fin = x; }
      status(esc(x));
    };
    crec.onerror = (e) => { if (e.error === "not-allowed") { toast("Povol mikrofon"); stopConvo(); } };
    crec.onend = async () => {
      crec = null;
      if (fin.trim() && !echo(fin)) await handle(fin.trim());
      if (convo) { status("Poslouchám…"); setTimeout(loop, 150); }
    };
    try { crec.start(); } catch { setTimeout(loop, 400); }
  };
  loop();
  talk("Poslouchám.");
}
function stopConvo() {
  convo = false; try { crec?.abort(); } catch {}
  speechSynthesis.cancel(); $("#orb").className = "orb"; status("<b>Klepni a mluv.</b>");
}
$("#orb").onclick = () => (convo ? stopConvo() : startConvo());
$("#speakAll").onclick = readOut;

/* ---------- ovládání ---------- */
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 3200); }
$("#tabs").onclick = (e) => {
  const v = e.target.dataset.v; if (!v) return;
  $("#tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach((x) => x.classList.toggle("on", x.id === "v-" + v));
  store.set("tab", v);
  if (v === "repos") loadRepos();
};
$("#where").onclick = (e) => { const v = e.target.dataset.v; if (!v) return; filt.where = v; $("#where").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === v)); render(); };
$("#q").oninput = (e) => { filt.q = e.target.value.toLowerCase(); render(); };
$("#rq").oninput = () => repos && renderRepos();
$("#hs").onchange = renderHistory;
$("#newBtn").onclick = () => newSheet();
$("#settings").onclick = setup;
$("#runNow").onclick = runNow;
$("#refresh").onclick = () => { repos = null; load(); toast("Načteno znovu"); };
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
setInterval(() => { if (!document.hidden) load(); }, 120000);
applyTheme(); load();
if (store.get("tab") && store.get("tab") !== "sessions") $(`#tabs [data-v="${store.get("tab")}"]`)?.click();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
