name = "fd-kolega"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGIN = "https://frantisekdron.github.io"
APP_URL = "https://frantisekdron.github.io/fd-board/kolega/"
BRIDGE_REPO = "frantisekdron/fd-kolega"
VOICE = "marin"
SESSION_BUDGET_CENTS = "1000"   # strop na jednu pracovní session: $10

[triggers]
crons = ["* * * * *"]           # hlídač dokončených session → upozornění

[[kv_namespaces]]
binding = "STATE"
id = "KV_ID"                    # doplní GitHub Action při nasazení
